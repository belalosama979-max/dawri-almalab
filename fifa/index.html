<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>كأس الكنترولر</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="تنظيم بطولات فيفا على البلايستيشن.">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#090C16">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="كأس الكنترولر">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: console-room dashboard; a broadcast-style score strip carries each live match, PS face-button colours mark actions and results; bottom tab bar for thumbs. Dark-first. */
:root{
  --bg:#090C16; --bg-2:#0D1222; --surface:#131A2D; --surface-2:#1B2440; --line:#27325A; --ink:#EDF1FF; --muted:#8A95BC;
  --accent:#4C7DFF; --accent-2:#7B9BFF; --accent-ink:#FFFFFF; --glow:rgba(76,125,255,.32);
  --tri:#2ED3A0; --circ:#FF5A6A; --cross:#7B9BFF; --sq:#F27BD8;
  --win:#2ED3A0; --win-soft:rgba(46,211,160,.14); --draw:#F2B84B; --draw-soft:rgba(242,184,75,.15); --loss:#FF5A6A; --loss-soft:rgba(255,90,106,.14);
  --gold:#FFC94A; --gold-soft:rgba(255,201,74,.14); --shade:rgba(3,5,12,.72);
  --hud:#0B1020; --hud-ink:#FFFFFF;
  --f-display:'Lalezar','Readex Pro',system-ui,'Segoe UI',Tahoma,sans-serif;
  --f-body:'Readex Pro',system-ui,'Segoe UI',Tahoma,sans-serif;
  --f-num:'Oxanium','Readex Pro',ui-monospace,'Segoe UI',sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#EEF1F8; --bg-2:#E6EAF5; --surface:#FFFFFF; --surface-2:#E4E9F5; --line:#CFD7EA; --ink:#0B1124; --muted:#56608A;
  --accent:#2F5FE8; --accent-2:#2F5FE8; --accent-ink:#FFFFFF; --glow:rgba(47,95,232,.18);
  --tri:#0E9E72; --circ:#D93848; --cross:#2F5FE8; --sq:#B5379C;
  --win:#0E9E72; --win-soft:rgba(14,158,114,.12); --draw:#B57F10; --draw-soft:rgba(181,127,16,.13); --loss:#D93848; --loss-soft:rgba(217,56,72,.1);
  --gold:#A87800; --gold-soft:rgba(232,176,30,.16); --shade:rgba(10,16,36,.5);
  --hud:#0E1530; --hud-ink:#FFFFFF; color-scheme:light }}
:root[data-theme="light"]{
  --bg:#EEF1F8; --bg-2:#E6EAF5; --surface:#FFFFFF; --surface-2:#E4E9F5; --line:#CFD7EA; --ink:#0B1124; --muted:#56608A;
  --accent:#2F5FE8; --accent-2:#2F5FE8; --accent-ink:#FFFFFF; --glow:rgba(47,95,232,.18);
  --tri:#0E9E72; --circ:#D93848; --cross:#2F5FE8; --sq:#B5379C;
  --win:#0E9E72; --win-soft:rgba(14,158,114,.12); --draw:#B57F10; --draw-soft:rgba(181,127,16,.13); --loss:#D93848; --loss-soft:rgba(217,56,72,.1);
  --gold:#A87800; --gold-soft:rgba(232,176,30,.16); --shade:rgba(10,16,36,.5);
  --hud:#0E1530; --hud-ink:#FFFFFF; color-scheme:light }

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-tap-highlight-color:transparent;background:var(--bg) radial-gradient(1200px 500px at 85% -10%,var(--glow),transparent 60%) no-repeat}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.4}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{margin:0;font-family:var(--f-display);font-weight:400;line-height:1.3;text-wrap:balance;letter-spacing:0}
p{margin:0}
.ic{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.muted{color:var(--muted)} .small{font-size:13px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.ltr{direction:ltr;unicode-bidi:isolate}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:8px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:4px 0;min-width:0;flex:1;text-align:right}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--accent),#2A3F99);color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 6px 18px var(--glow)}
.logo .ic{width:26px;height:26px}
.brand-t{display:grid;min-width:0}
.brand-t b{font-family:var(--f-display);font-size:20px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.brand-t small{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-act{display:flex;gap:2px}
.icon-btn{width:44px;height:44px;border-radius:12px;border:1px solid transparent;background:none;display:grid;place-items:center;color:var(--ink)}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn[aria-current="page"]{background:var(--surface-2);color:var(--accent-2)}

/* main */
.main{max-width:1100px;margin:0 auto;display:grid;gap:16px;padding-block:16px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.main>*{min-width:0}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-head h2{font-size:28px}
.eyebrow{font-size:13px;font-weight:600;color:var(--muted)}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg-2);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
.nav-in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 10px;background:none;border:0;font-size:12px;font-weight:600;color:var(--muted);min-height:62px}
.nav button[aria-current="page"]{color:var(--accent-2)}
.nav button[aria-current="page"]::before{content:"";position:absolute;top:0;inset-inline:26%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.nav .dot{position:absolute;top:9px;inset-inline-start:calc(50% + 8px);width:9px;height:9px;border-radius:50%;background:var(--circ);animation:pulse 1.2s infinite}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:14px;min-width:0}
.card h3{font-size:21px}
.grid2{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.grid2>*{min-width:0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stack{display:grid;gap:10px}
.split{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 18px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font-weight:600;transition:transform .12s ease,background .15s,box-shadow .15s;white-space:nowrap}
.btn:active:not(:disabled){transform:scale(.97)}
.btn-primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;box-shadow:0 6px 20px var(--glow)}
.btn-ghost{background:transparent}
.btn-danger{color:var(--circ);border-color:color-mix(in srgb,var(--circ) 60%,transparent);background:transparent}
.btn-xl{min-height:66px;font-size:clamp(17px,4.8vw,21px);width:100%;border-radius:18px}
.btn-sm{min-height:40px;padding:0 12px;font-size:14px;border-radius:11px}
.btn-wide{width:100%}
.ps{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;border:2px solid currentColor;font-size:12px;line-height:1;flex:none;font-family:var(--f-num);font-weight:800}
.ps svg{width:12px;height:12px}
.ps.x{color:var(--cross)} .ps.o{color:var(--circ)} .ps.t{color:var(--tri)} .ps.s{color:var(--sq)}
.btn-primary .ps{color:#fff}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--ink);white-space:nowrap}
.chip.live{background:var(--loss-soft);color:var(--circ)}
.chip.live::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;animation:pulse 1.1s infinite}
.chip.ok{background:var(--win-soft);color:var(--win)}
.chip.warn{background:var(--draw-soft);color:var(--draw)}
.chip.gold{background:var(--gold-soft);color:var(--gold)}
.chip.acc{background:var(--glow);color:var(--accent-2)}

/* club badge */
.badge{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-family:var(--f-display);font-size:17px;color:#fff;flex:none;line-height:1;box-shadow:inset 0 -3px 0 rgba(0,0,0,.22)}
.badge.lg{width:56px;height:56px;border-radius:16px;font-size:28px}
.badge.sm{width:26px;height:26px;border-radius:8px;font-size:14px}

/* HUD score strip */
.hud{background:var(--hud);color:var(--hud-ink);border-radius:20px;overflow:hidden;border:1px solid rgba(255,255,255,.08);box-shadow:0 18px 40px rgba(0,0,0,.35)}
.hud-strip{display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch}
.hud-side{display:flex;align-items:center;gap:10px;padding:14px 12px;min-width:0;position:relative}
.hud-side.b{flex-direction:row-reverse;text-align:left}
.hud-side::after{content:"";position:absolute;inset-block:0;width:6px;background:var(--c)}
.hud-side.a::after{right:0} .hud-side.b::after{left:0}
.hud-name{display:grid;min-width:0}
.hud-name b{font-family:var(--f-display);font-size:clamp(18px,5vw,28px);font-weight:400;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hud-name small{font-size:12px;opacity:.7;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hud-score{display:flex;align-items:center;gap:6px;padding:0 6px;background:rgba(255,255,255,.06);font-family:var(--f-num);font-weight:800;font-size:clamp(38px,11vw,64px);line-height:1;direction:ltr}
.hud-score i{font-style:normal;opacity:.45;font-size:.6em}
.hud-score .pk{font-size:.38em;opacity:.8;align-self:flex-end;padding-bottom:6px}
.hud-clock{display:flex;justify-content:center;align-items:center;gap:10px;padding:8px 12px;background:rgba(255,255,255,.04);border-top:1px solid rgba(255,255,255,.07);flex-wrap:wrap}
.hud-clock .per{font-size:13px;font-weight:700;padding:3px 10px;border-radius:8px;background:rgba(255,255,255,.1)}
.hud-clock .per.live{background:#FF5A6A;color:#fff}
.hud-clock .t{font-family:var(--f-num);font-weight:700;font-size:20px;direction:ltr}
.clock-xl{font-family:var(--f-num);font-weight:800;font-size:clamp(78px,24vw,190px);line-height:1;text-align:center;direction:ltr;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.clock-xl.low{color:var(--draw)}
.clock-xl.zero{color:var(--circ);animation:blink 1s steps(2,start) infinite}
.bar{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .3s linear}
.periods{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:6px}
.periods span{height:6px;border-radius:99px;background:var(--surface-2)}
.periods span.done{background:var(--accent)}
.periods span.now{background:linear-gradient(90deg,var(--accent) var(--p),var(--surface-2) var(--p))}

/* console cards */
.consoles{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr))}
.cons{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;display:grid;gap:12px;position:relative;overflow:hidden;min-width:0}
.cons.on{border-color:color-mix(in srgb,var(--circ) 55%,var(--line))}
.cons-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.cons-head b{font-family:var(--f-display);font-size:19px;font-weight:400;display:flex;gap:8px;align-items:center}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.vs .p{display:flex;align-items:center;gap:8px;min-width:0}
.vs .p.b{flex-direction:row-reverse;text-align:left}
.vs .p span{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.vs .mid{font-family:var(--f-num);font-weight:800;font-size:22px;direction:ltr;color:var(--muted)}
.vs .mid.sc{color:var(--ink);font-size:30px}
.mini-clock{font-family:var(--f-num);font-weight:800;font-size:44px;line-height:1;direction:ltr;text-align:center}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:grid;gap:2px;min-width:0}
.kpi b{font-family:var(--f-num);font-size:28px;font-weight:800;line-height:1.1}
.kpi span{font-size:13px;color:var(--muted)}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,1fr)}}
.progress{display:grid;gap:6px}

/* hero */
.hero{position:relative;overflow:hidden;isolation:isolate;border-radius:24px;padding:26px 20px;display:grid;gap:14px;background:linear-gradient(140deg,#13204A,#0A0F22 60%);color:#fff;border:1px solid rgba(255,255,255,.08)}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;z-index:-1;opacity:.55}
.hero h1{font-size:clamp(34px,9vw,58px);line-height:1.15}
.hero p{max-width:48ch;opacity:.88}
.hero .eyebrow{color:#B8C6FF}
.feat{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}
.feat div{background:rgba(255,255,255,.07);border-radius:14px;padding:12px;display:flex;gap:10px;align-items:flex-start}
.feat b{display:block;font-weight:700}
.feat small{opacity:.8}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 8px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
td{font-family:var(--f-num);font-weight:600}
tr:last-child td{border-bottom:0}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--surface-2)}
td.name{text-align:right;font-family:var(--f-body);font-weight:600;min-width:150px}
td.name .in{display:flex;align-items:center;gap:8px}
td.name .in span{display:grid;line-height:1.25}
td.name small{font-size:11px;color:var(--muted);font-weight:400}
td.pts{font-weight:800;font-size:18px}
tr.q td:first-child{box-shadow:inset -4px 0 0 var(--tri)}
tr.top td{background:var(--gold-soft)}
.form{display:inline-flex;gap:3px;direction:rtl}
.form i{width:18px;height:18px;border-radius:5px;font-style:normal;font-size:10px;font-weight:800;display:grid;place-items:center;color:#fff;font-family:var(--f-body)}
.form .W{background:var(--win)} .form .D{background:var(--draw)} .form .L{background:var(--loss)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tabs button{flex:none;min-height:42px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* match list */
.mlist{display:grid;gap:8px}
.mrow{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px}
.mrow.live{border-color:var(--circ)}
.mrow.next{border-color:var(--accent);border-style:dashed}
.mrow.cancel{opacity:.55}
.mmain{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;background:none;border:0;padding:8px;text-align:right;min-width:0;border-radius:12px;color:var(--ink)}
.mmain:hover{background:var(--surface-2)}
.mno{width:36px;height:36px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;font-family:var(--f-num);font-weight:800}
.mrow.live .mno{background:var(--circ);color:#fff}
.mbody{display:grid;gap:5px;min-width:0}
.mt{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.mt .p{display:flex;align-items:center;gap:6px;min-width:0}
.mt .p.b{flex-direction:row-reverse;text-align:left}
.mt .p span{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mt .sc{font-family:var(--f-num);font-weight:800;direction:ltr;min-width:56px;text-align:center}
.mt .sc.vs{color:var(--muted);font-family:var(--f-body);font-weight:500;font-size:13px}
.mt .w span{color:var(--win)}
.mmeta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.arrows{display:flex;flex-direction:column;gap:2px}
.arrows .icon-btn{width:40px;height:36px}
.round-h{font-size:14px;color:var(--muted);font-weight:600;margin-top:6px}

/* bracket */
.bracket{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(200px,1fr);gap:14px;overflow-x:auto;padding-bottom:6px}
.bcol{display:grid;gap:10px;align-content:space-around}
.bcol h4{font-size:17px;color:var(--muted)}
.bm{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.bm div{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;min-height:42px}
.bm div+div{border-top:1px solid var(--line)}
.bm .w{background:var(--win-soft);font-weight:700}
.bm .tbd{color:var(--muted)}
.bm .nm{display:flex;align-items:center;gap:8px;min-width:0}
.bm .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* leaderboards */
.lb{display:grid;gap:6px}
.lb-row{display:grid;grid-template-columns:30px auto 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:12px;background:var(--surface-2)}
.lb-row .rk{font-family:var(--f-num);font-weight:800;color:var(--muted);text-align:center}
.lb-row:first-child .rk{color:var(--gold)}
.lb-row .who{display:grid;min-width:0;line-height:1.3}
.lb-row .who span{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-row .who small{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-row b{font-family:var(--f-num);font-size:20px;font-weight:800}
.awards{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.award{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:6px;min-width:0}
.award .lbl{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center}
.award b{font-family:var(--f-display);font-size:22px;font-weight:400;overflow-wrap:anywhere;line-height:1.3}
.award small{color:var(--muted)}
.h2h th,.h2h td{padding:8px 6px;font-size:13px}
.h2h td.c{min-width:64px}
.h2h td.self{background:var(--surface-2)}
.h2h td .w{color:var(--win)} .h2h td .l{color:var(--loss)}

/* forms */
.field{display:grid;gap:6px;min-width:0}
.field>label,.lbl{font-size:14px;font-weight:600}
.hint{font-size:13px;color:var(--muted)}
input[type=text],input[type=number],select,textarea{width:100%;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg-2);color:var(--ink);padding:0 12px}

textarea{padding:10px 12px;min-height:150px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;direction:ltr;text-align:left}

.chk{display:flex;gap:10px;align-items:flex-start;padding:6px 0}
.chk input{width:22px;height:22px;margin-top:2px;accent-color:var(--accent);flex:none}
.prow{display:grid;grid-template-columns:auto 1fr 1fr 44px;gap:8px;align-items:center}

.swatch{width:44px;height:44px;border-radius:12px;border:2px solid rgba(255,255,255,.25);display:grid;place-items:center;color:#fff;font-family:var(--f-display);font-size:18px}
.fmt{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}

.fmt button b{font-family:var(--f-display);font-size:19px;font-weight:400}
.fmt button small{color:var(--muted);font-size:13px}
.fmt button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent);background:var(--glow)}
.pts3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.preview{display:flex;flex-wrap:wrap;gap:8px 18px;padding:14px;border-radius:14px;background:var(--surface-2)}
.preview b{font-family:var(--f-num);font-size:22px;font-weight:800}
.errs{display:grid;gap:6px;padding:12px 14px;border-radius:14px;background:var(--loss-soft);font-size:14px}

.note{padding:12px 14px;border-radius:14px;background:var(--surface-2);font-size:14px}
.note.ok{background:var(--win-soft)} .note.warn{background:var(--draw-soft)}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:14px 16px;border-radius:16px;background:var(--draw-soft);border:1px solid var(--draw)}
.banner.acc{background:var(--glow);border-color:var(--accent)}
.banner b{font-family:var(--f-display);font-size:19px;font-weight:400}

/* match screen */
.mscreen{display:grid;gap:14px}
@media (min-width:920px){.mscreen{grid-template-columns:1.2fr 1fr;align-items:start}.mscreen .full{grid-column:1/-1}}
.clock-card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px;display:grid;gap:12px}
.goal-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.adj{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}

@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

};
const ic=n=>`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]||''}</svg>`;
const PS={x:'<span class="ps x" aria-hidden="true">✕</span>',o:'<span class="ps o" aria-hidden="true">○</span>',t:'<span class="ps t" aria-hidden="true">△</span>',s:'<span class="ps s" aria-hidden="true">□</span>'};
const TROPHY=`<svg class="trophy" viewBox="0 0 64 64" aria-hidden="true"><path fill="currentColor" d="M18 6h28v14a14 14 0 0 1-28 0z"/><path fill="none" stroke="currentColor" stroke-width="4" d="M18 11H9a9 9 0 0 0 10 12M46 11h9a9 9 0 0 1-10 12"/><rect x="29" y="33" width="6" height="11" fill="currentColor"/><path fill="currentColor" d="M21 44h22l3 8H18z"/><rect x="15" y="52" width="34" height="6" rx="2" fill="currentColor"/></svg>`;

const FORMAT={league:'دوري',double:'دوري ذهاب وإياب',ko:'خروج المغلوب',groups:'مجموعات ثم خروج المغلوب'};
const STATE={idle:'لم تبدأ',running:'جارية',paused:'متوقفة مؤقتاً',done:'انتهت'};
const PER={h1:'الشوط الأول',ht:'بين الشوطين',h2:'الشوط الثاني',et1:'الإضافي الأول',et2:'الإضافي الثاني'};
const PER_SHORT={h1:'ش1',ht:'استراحة',h2:'ش2',et1:'إ1',et2:'إ2'};
const GROUP_NAMES=['أ','ب','ج','د','هـ','و','ز','ح'];

/* ---------- storage ---------- */
let storageOK=true;
function load(){
  let d=null; try{const r=localStorage.getItem(KEY); if(r) d=JSON.parse(r);}catch(e){storageOK=false;}
  if(!d||d.v!==1) d={v:1,leagues:[],currentId:null,draft:null,view:'home',prefs:{}};
  d.prefs=Object.assign({theme:'system',sound:true,vibrate:true},d.prefs||{});
  if(!Array.isArray(d.leagues)) d.leagues=[];
  return d;
}
let DB=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB));storageOK=true;}catch(e){storageOK=false;}}
const ui={view:DB.view||'home',matchId:DB.matchId||null,sheet:null,goal:null,flash:null,toast:null,celebrate:false,tab:{},statsTab:'gamers'};

/* ================= ENGINE (pure) ================= */
const E={};
E.roundRobin=(ids,legs)=>{
  const arr=ids.slice(); if(arr.length%2) arr.push(null);
  const n=arr.length,R=n-1,out=[],byes={}; let rot=arr.slice();
  for(let r=0;r<R;r++){
    for(let i=0;i<n/2;i++){const x=rot[i],y=rot[n-1-i]; if(x===null||y===null){byes[r+1]=x===null?y:x;continue;} out.push({a:((r+i)%2===0)?x:y,b:((r+i)%2===0)?y:x,round:r+1,leg:1});}
    rot=[rot[0],rot[n-1]].concat(rot.slice(1,n-1));
  }
  if(legs===2){out.slice().forEach(m=>out.push({a:m.b,b:m.a,round:m.round+R,leg:2}));Object.keys(byes).forEach(k=>{byes[+k+R]=byes[k];});}
  return {matches:out,byes};
};
const overlap=(p,c)=>!!p&&!!c&&(p.a===c.a||p.a===c.b||p.b===c.a||p.b===c.b);
E.arrange=(ms,before)=>{
  if(ms.length<2) return ms.slice();
  let best=null,bestScore=Infinity;
  for(let t=0;t<400;t++){
    const pool=ms.slice(),out=[];
    while(pool.length){
      const minR=Math.min.apply(null,pool.map(m=>m.round)),prev=out[out.length-1]||before||null;
      let cand=pool.filter(m=>m.round<=minR+(t===0?0:1));
      let free=cand.filter(m=>!overlap(prev,m)); if(!free.length) free=pool.filter(m=>!overlap(prev,m)&&m.round<=minR+2);
      const from=free.length?free:cand, lr=Math.min.apply(null,from.map(m=>m.round)), lowest=t<2?from.filter(m=>m.round===lr):from;
      const pick=t===0?lowest[0]:lowest[Math.floor(Math.random()*lowest.length)];
      out.push(pick); pool.splice(pool.indexOf(pick),1);
    }
    let conf=overlap(before,out[0])?1:0,dis=0;
    for(let i=1;i<out.length;i++){if(overlap(out[i-1],out[i]))conf++; if(out[i].round<out[i-1].round)dis++;}
    const sc=conf*1000+dis; if(sc<bestScore){best=out;bestScore=sc;if(!sc)break;}
  }
  return best;
};
E.seedOrder=size=>{let o=[1];while(o.length<size){const n=o.length*2;o=o.reduce((a,s)=>a.concat([s,n+1-s]),[]);}return o;};
E.groupSlots=(W,R)=>{ /* winners W[g], runners R[g]; cross-pair A1–B2, B1–A2 … so group mates sit in opposite halves */
  if(!R)return E.slotsFromSeeds(W);const g=W.length,size=2*g,s=W.slice();for(let i=0;i<g;i++)s[size-1-i]=R[i^1];return E.slotsFromSeeds(s);
};
E.slotsFromSeeds=seeds=>{let size=1;while(size<seeds.length)size*=2;return {size,slots:E.seedOrder(size).map(s=>s<=seeds.length?seeds[s-1]:null)};};
E.winner=m=>m.sa>m.sb?m.a:m.sb>m.sa?m.b:(m.pa>m.pb?m.a:m.pb>m.pa?m.b:null);
E.loser=m=>{const w=E.winner(m);return w===m.a?m.b:m.a;};
E.koRounds=L=>{
  if(!L.ko) return [];
  const R=Math.round(Math.log2(L.ko.size)),rounds=[L.ko.slots.slice()];
  for(let r=0;r<R;r++){const c=rounds[r],nx=[];
    for(let k=0;k<c.length/2;k++){const a=c[2*k],b=c[2*k+1];let w;
      if(a===undefined||b===undefined)w=undefined; else if(a===null&&b===null)w=null; else if(a===null)w=b; else if(b===null)w=a;
      else{const m=L.matches.find(x=>x.ko&&x.ko.r===r&&x.ko.k===k);w=(m&&m.status==='done'&&m.a===a&&m.b===b)?E.winner(m):undefined;}
      nx.push(w);}
    rounds.push(nx);}
  return rounds;
};
E.koSync=(L,mk)=>{
  if(!L.ko) return;
  for(let pass=0;pass<8;pass++){
    const rounds=E.koRounds(L),R=rounds.length-1;let ch=false;
    for(let r=0;r<R;r++)for(let k=0;k<rounds[r].length/2;k++){
      const a=rounds[r][2*k],b=rounds[r][2*k+1],m=L.matches.find(x=>x.ko&&x.ko.r===r&&x.ko.k===k),ready=typeof a==='string'&&typeof b==='string';
      if(ready&&!m){L.matches.push(mk(a,b,{stage:'ko',ko:{r,k},round:r+1}));ch=true;}
      else if(m&&m.status==='pending'){if(!ready){L.matches.splice(L.matches.indexOf(m),1);ch=true;}else if(m.a!==a||m.b!==b){m.a=a;m.b=b;ch=true;}}
    }
    if(!ch) break;
  }
};
E.koRoundName=(r,R)=>{const left=R-r;return left===1?'النهائي':left===2?'نصف النهائي':left===3?'ربع النهائي':'دور الـ'+Math.pow(2,left);};
E.table=(L,ids,ms)=>{
  const P=L.points,rows=ids.map(id=>({id,P:0,W:0,D:0,L:0,GF:0,GA:0,GD:0,Pts:0,CS:0,form:[]})),by={};rows.forEach(r=>by[r.id]=r);
  const done=ms.filter(m=>m.status==='done'&&by[m.a]&&by[m.b]).sort((x,y)=>(x.finishedAt||0)-(y.finishedAt||0));
  done.forEach(m=>{const A=by[m.a],B=by[m.b];A.P++;B.P++;A.GF+=m.sa;A.GA+=m.sb;B.GF+=m.sb;B.GA+=m.sa;if(m.sb===0)A.CS++;if(m.sa===0)B.CS++;
    if(m.sa>m.sb){A.W++;B.L++;A.Pts+=P.win;B.Pts+=P.loss;A.form.push('W');B.form.push('L');}
    else if(m.sa<m.sb){B.W++;A.L++;B.Pts+=P.win;A.Pts+=P.loss;A.form.push('L');B.form.push('W');}
    else{A.D++;B.D++;A.Pts+=P.draw;B.Pts+=P.draw;A.form.push('D');B.form.push('D');}});
  rows.forEach(r=>{r.GD=r.GF-r.GA;r.form=r.form.slice(-5);});
  const h2h=g=>{const ids=new Set(g.map(r=>r.id)),mm=new Map(g.map(r=>[r.id,{p:0,d:0,f:0}]));
    done.forEach(m=>{if(ids.has(m.a)&&ids.has(m.b)){const a=mm.get(m.a),b=mm.get(m.b);a.f+=m.sa;b.f+=m.sb;a.d+=m.sa-m.sb;b.d+=m.sb-m.sa;
      if(m.sa>m.sb){a.p+=P.win;b.p+=P.loss;}else if(m.sa<m.sb){b.p+=P.win;a.p+=P.loss;}else{a.p+=P.draw;b.p+=P.draw;}}});
    const o=new Map();mm.forEach((v,id)=>o.set(id,v.p*1e6+(v.d+1000)*1e3+v.f));return o;};
  const crit=['pts','gd','gf','h2h'];
  const val=(c,r,ctx)=>c==='pts'?r.Pts:c==='gd'?r.GD:c==='gf'?r.GF:(ctx.get(r.id)||0);
  const sortG=(g,cs)=>{if(g.length<2||!cs.length)return [g];const c=cs[0],ctx=c==='h2h'?h2h(g):null,v=new Map(g.map(r=>[r.id,val(c,r,ctx)]));
    const s=g.slice().sort((x,y)=>v.get(y.id)-v.get(x.id)),b=[];s.forEach(r=>{const l=b[b.length-1];if(l&&v.get(l[0].id)===v.get(r.id))l.push(r);else b.push([r]);});
    return b.reduce((a,x)=>a.concat(sortG(x,cs.slice(1))),[]);};
  let pos=1;const out=[];sortG(rows,crit).forEach(g=>{g.forEach(r=>{r.rank=pos;r.tied=g.length>1;out.push(r);});pos+=g.length;});
  return out;
};
E.isComplete=L=>{
  if(L.format==='league'||L.format==='double'){const v=L.matches.filter(m=>m.status!=='cancelled');return v.length>0&&v.every(m=>m.status==='done');}
  const r=E.koRounds(L);return r.length>0&&typeof r[r.length-1][0]==='string';
};
E.koRanking=L=>{
  const rounds=E.koRounds(L);if(!rounds.length)return [];
  const R=rounds.length-1,champ=rounds[R][0],res=[];
  if(typeof champ==='string')res.push({id:champ,rank:1,label:'البطل'});
  for(let r=R-1;r>=0;r--){const ms=L.matches.filter(m=>m.ko&&m.ko.r===r&&m.status==='done'),rank=res.length+1;ms.forEach(m=>res.push({id:E.loser(m),rank,label:r===R-1?'الوصيف':'خرج من '+E.koRoundName(r,R)}));}
  return res;
};
E.gamerStats=(L,ms)=>{
  ms=(ms||L.matches).filter(m=>m.status==='done');
  const S={};L.players.forEach(p=>S[p.id]={id:p.id,P:0,W:0,D:0,L:0,GF:0,GA:0,CS:0,best:null,worst:null,streak:0,bestStreak:0,unbeaten:0,bestUnbeaten:0,pens:{w:0,l:0},pos:[],shots:0,res:[]});
  ms.slice().sort((x,y)=>(x.finishedAt||0)-(y.finishedAt||0)).forEach(m=>{
    [['a','b'],['b','a']].forEach(([s,o])=>{const g=S[m[s]];if(!g)return;const f=m['s'+s],a=m['s'+o];
      g.P++;g.GF+=f;g.GA+=a;if(a===0)g.CS++;
      const r=f>a?'W':f<a?'L':'D';g[r]++;g.res.push({m,r,f,a,opp:m[o]});
      if(r==='W'){g.streak++;g.bestStreak=Math.max(g.bestStreak,g.streak);}else g.streak=0;
      if(r!=='L'){g.unbeaten++;g.bestUnbeaten=Math.max(g.bestUnbeaten,g.unbeaten);}else g.unbeaten=0;
      const diff=f-a;if(!g.best||diff>g.best.diff||(diff===g.best.diff&&f>g.best.f))g.best={diff,f,a,m};
      if(r==='D'&&m.pa!=null&&m.pb!=null&&(m.pa||m.pb)){if(E.winner(m)===m[s])g.pens.w++;else g.pens.l++;}
      if(m.st&&m.st.pos!=null){g.pos.push(s==='a'?m.st.pos:100-m.st.pos);}
      if(m.st&&m.st['sh'+s]!=null)g.shots+=m.st['sh'+s];});
  });
  return Object.values(S);
};
E.scorers=L=>{
  const map=new Map();
  L.matches.filter(m=>m.status==='done').forEach(m=>m.events.forEach(e=>{if(!e.name)return;const pid=m[e.side],k=pid+'|'+e.name.trim();const r=map.get(k)||{pid,name:e.name.trim(),G:0};r.G++;map.set(k,r);}));
  return [...map.values()].sort((a,b)=>b.G-a.G);
};
E.h2h=(L,a,b)=>{const r={P:0,W:0,D:0,L:0,GF:0,GA:0};L.matches.filter(m=>m.status==='done'&&((m.a===a&&m.b===b)||(m.a===b&&m.b===a))).forEach(m=>{const f=m.a===a?m.sa:m.sb,g=m.a===a?m.sb:m.sa;r.P++;r.GF+=f;r.GA+=g;if(f>g)r.W++;else if(f<g)r.L++;else r.D++;});return r;};
E.parseRoster=txt=>{const out=[],seen=new Set();String(txt||'').split(/\r?\n|،|;/).forEach(line=>{line=line.replace(/^\s*\d+\s*[-.)]\s*/,'').trim();if(!line)return;const parts=line.split(/\s*[-–—|:,\t]\s*/);const name=(parts[0]||'').trim().slice(0,24),club=(parts.slice(1).join(' ')||'').trim().slice(0,24);if(name&&!seen.has(name)){seen.add(name);out.push({name,club});}});return out;};

/* ---------- model helpers ---------- */
function newMatch(a,b,x){return Object.assign({id:uid(),a,b,stage:'league',round:0,status:'pending',sa:0,sb:0,pa:null,pb:null,events:[],period:null,run:false,wait:false,endAt:null,rem:null,dur:null,console:null,startedAt:null,finishedAt:null,st:null},x||{});}
const cur=()=>DB.leagues.find(l=>l.id===DB.currentId)||null;
const pl=(L,id)=>L.players.find(p=>p.id===id);
const pname=(L,id)=>{if(id===null)return 'تأهل مباشر';if(id===undefined)return 'يُحدَّد لاحقاً';const p=pl(L,id);return p?p.name:'—';};
const byId=(L,id)=>L.matches.find(m=>m.id===id);
const isActive=m=>m.status==='live'||m.status==='scoring';
const actives=L=>L.matches.filter(isActive);
const pend=L=>L.matches.filter(m=>m.status==='pending');
const started=L=>L.matches.some(m=>m.status!=='pending'&&m.status!=='cancelled');
const isKO=m=>m.stage==='ko';
function lstate(L){if(L.status==='done')return 'done';if(L.status==='paused')return 'paused';return started(L)?'running':'idle';}
function badge(L,id,cls){const p=pl(L,id);if(!p)return `<span class="badge ${cls||''}" style="background:var(--surface-2);color:var(--muted)">؟</span>`;return `<span class="badge ${cls||''}" style="background:${p.color}">${esc(initial(p))}</span>`;}
function initial(p){const s=(p.club||p.name||'?').trim();return s.replace(/^ال/,'').charAt(0)||'?';}
function sub(L,id){const p=pl(L,id);return p&&p.club?p.club:'';}
function busyIds(L){const s=new Set();actives(L).forEach(m=>{s.add(m.a);s.add(m.b);});return s;}
function periodDur(L,p){return p==='ht'?L.htSec*1000:(p==='et1'||p==='et2')?Math.round(L.etMin*60000):Math.round(L.halfMin*60000);}
function remaining(m){if(m.status!=='live')return 0;return m.run?Math.max(0,m.endAt-now()):Math.max(0,m.rem||0);}
function perList(L,m){const a=['h1','h2'];if(isKO(m)&&L.extraTime&&(m.period==='et1'||m.period==='et2'||m.etPlayed))a.push('et1','et2');return a;}
function gameMinute(L,m){
  const base={h1:0,h2:45,et1:90,et2:105}[m.period],len=(m.period==='et1'||m.period==='et2')?15:45;
  if(base==null) return m.period==='ht'?45:null;
  const d=m.dur||1,el=d-remaining(m);return Math.min(base+len,base+Math.max(1,Math.ceil(el/d*len)));
}
function roundLabel(L,m){
  if(m.stage==='ko'&&m.ko&&L.ko)return E.koRoundName(m.ko.r,Math.round(Math.log2(L.ko.size)));
  if(m.stage==='group')return 'المجموعة '+GROUP_NAMES[m.group]+' · الجولة '+m.round;
  if(m.extra)return 'مباراة إضافية';
  if(!m.round)return '';
  return 'الجولة '+m.round+(L.format==='double'?(m.leg===2?' · الإياب':' · الذهاب'):'')+(m.extraRound?' · دور إضافي':'');
}
function totals(L){
  const v=L.matches.filter(m=>m.status!=='cancelled'),d=v.filter(m=>m.status==='done').length;let t=v.length;
  if(L.format==='ko')t=Math.max(0,L.players.length-1);
  if(L.format==='groups'){const gm=L.matches.filter(m=>m.stage==='group'&&m.status!=='cancelled').length;t=gm+Math.max(0,L.groupCount*L.qualify-1);}
  return {total:t,done:d,left:Math.max(0,t-d)};
}
function nextFor(L){ /* pending matches whose players are free, in queue order, without repeating a player */
  const busy=busyIds(L),out=[];
  pend(L).forEach(m=>{if(busy.has(m.a)||busy.has(m.b))return;out.push(m);busy.add(m.a);busy.add(m.b);});
  return out;
}
function consoleMatch(L,c){return actives(L).find(m=>m.console===c)||null;}
function consoleSuggestions(L){
  const list=nextFor(L),res={};let k=0;
  for(let c=1;c<=L.consoleCount;c++){if(!consoleMatch(L,c)){res[c]=list[k]||null;if(list[k])k++;}}
  return res;
}
function moveToFront(L,m){const i=L.matches.indexOf(m);L.matches.splice(i,1);let j=L.matches.findIndex(x=>x.status==='pending');if(j<0)j=L.matches.length;L.matches.splice(j,0,m);}
function matchCount(n,f,g,q){if(n<2)return 0;if(f==='league')return n*(n-1)/2;if(f==='double')return n*(n-1);if(f==='ko')return n-1;
  let t=0;const sizes=groupSizes(n,g);sizes.forEach(s=>t+=s*(s-1)/2);return t+Math.max(0,g*q-1);}
function groupSizes(n,g){const s=new Array(g).fill(Math.floor(n/g));for(let i=0;i<n%g;i++)s[i]++;return s;}
function build(L){
  const ids=L.players.map(p=>p.id);L.byes={};L.ko=null;L.groups=null;
  if(L.format==='league'||L.format==='double'){const rr=E.roundRobin(ids,L.format==='double'?2:1);L.byes=rr.byes;L.matches=E.arrange(rr.matches).map(x=>newMatch(x.a,x.b,{round:x.round,leg:x.leg}));return;}
  if(L.format==='ko'){L.ko=E.slotsFromSeeds(ids);L.matches=[];E.koSync(L,newMatch);return;}
  const g=L.groupCount,groups=Array.from({length:g},()=>[]);ids.forEach((id,i)=>{const row=Math.floor(i/g),col=row%2?g-1-(i%g):i%g;groups[col].push(id);});
  L.groups=groups;const all=[];
  groups.forEach((gr,gi)=>{const rr=E.roundRobin(gr,1);rr.matches.forEach(x=>all.push(Object.assign(x,{group:gi})));});
  L.matches=E.arrange(all).map(x=>newMatch(x.a,x.b,{stage:'group',group:x.group,round:x.round}));
}
function groupTables(L){return (L.groups||[]).map((ids,gi)=>E.table(L,ids,L.matches.filter(m=>m.stage==='group'&&m.group===gi)));}
function groupsDone(L){const gm=L.matches.filter(m=>m.stage==='group'&&m.status!=='cancelled');return gm.length>0&&gm.every(m=>m.status==='done');}
function maybeBuildKO(L){
  if(L.format!=='groups'||L.ko||!groupsDone(L))return false;
  const T=groupTables(L),W=T.map(t=>t[0]&&t[0].id),Rn=L.qualify>1?T.map(t=>t[1]&&t[1].id):null;
  L.ko=E.groupSlots(W,Rn);E.koSync(L,newMatch);return true;
}

/* ---------- sound / vibration / wake ---------- */
let actx=null;
function unlockAudio(){try{if(!actx){const C=window.AudioContext||window.webkitAudioContext;if(C)actx=new C();}if(actx&&actx.state==='suspended')actx.resume();}catch(e){}}
function whistle(t0,d){const o=actx.createOscillator(),g=actx.createGain(),l=actx.createOscillator(),lg=actx.createGain();o.type='sine';o.frequency.value=2900;l.frequency.value=27;lg.gain.value=150;l.connect(lg);lg.connect(o.frequency);o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(.3,t0+.02);g.gain.setValueAtTime(.3,t0+d-.05);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.start(t0);l.start(t0);o.stop(t0+d+.05);l.stop(t0+d+.05);}
function beep(t0,f,d,type){const o=actx.createOscillator(),g=actx.createGain();o.type=type||'triangle';o.frequency.value=f;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(.35,t0+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.start(t0);o.stop(t0+d+.03);}
function alarm(k){
  if(DB.prefs.vibrate){try{navigator.vibrate&&navigator.vibrate(k==='end'?[400,120,400,120,800]:k==='half'?[400,150,400]:k==='ready'?[250,120,250]:[120]);}catch(e){}}
  if(!DB.prefs.sound)return;
  try{unlockAudio();if(!actx)return;const t=actx.currentTime+.03;
    if(k==='start')whistle(t,.5);
    else if(k==='half'){whistle(t,.35);whistle(t+.5,.7);}
    else if(k==='end'){whistle(t,.28);whistle(t+.4,.28);whistle(t+.8,1.1);}
    else if(k==='ready'){beep(t,660,.16);beep(t+.22,880,.16);beep(t+.44,1320,.35);}
    else if(k==='goal'){beep(t,523,.12,'square');beep(t+.12,784,.25,'square');}
    else if(k==='win'){[523,659,784,1047,1319].forEach((f,i)=>beep(t+i*.15,f,.32));}
  }catch(e){}
}
let wakeLock=null;
async function keepAwake(on){try{if(on){if(!wakeLock&&navigator.wakeLock&&document.visibilityState==='visible'){wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null;});}}else if(wakeLock){const w=wakeLock;wakeLock=null;await w.release();}}catch(e){wakeLock=null;}}
function syncWake(){const L=cur();keepAwake(!!(L&&L.status!=='paused'&&(L.matches.some(m=>m.status==='live'&&m.run)||(L.cons||[]).some(c=>c&&c.breakEnd))));}

    if(waiting.length&&L.consoleCount>1) out+=`<div class="note"><b>بعدها بالدور:</b> ${waiting.slice(0,4).map(m=>esc(pname(L,m.a))+' ضد '+esc(pname(L,m.b))).join(' · ')}</div>`;
  }
  out+=`<div class="progress"><div class="split"><span class="eyebrow">التقدّم</span><span class="num small">${t.done}/${t.total}</span></div><div class="bar"><i style="width:${t.total?100*t.done/t.total:0}%"></i></div></div>`;
  out+=`<div class="kpis"><div class="kpi"><b>${L.players.length}</b><span>لاعبون</span></div><div class="kpi"><b>${t.total}</b><span>مباراة</span></div><div class="kpi"><b>${t.left}</b><span>متبقية</span></div><div class="kpi"><b>${L.matches.filter(m=>m.status==='done').reduce((a,m)=>a+m.sa+m.sb,0)}</b><span>هدف</span></div></div>`;
  out+=`<div class="grid2">${miniTable(L)}${recentCard(L)}</div>`;

  return out;
}
function fmtMin(x){return Number.isInteger(x)?x+' د':(x*60)+' ث';}
function waitingList(L){const sugg=Object.values(consoleSuggestions(L)).filter(Boolean),ids=new Set(sugg.map(m=>m.id));return pend(L).filter(m=>!ids.has(m.id));}
function consoleCard(L,c,sugg){
  const m=consoleMatch(L,c),cs=(L.cons||[])[c-1]||{},label=L.consoleCount>1?'جهاز '+c:'الجهاز';
  if(m){
    const isLive=m.status==='live',p=m.period,clk=isLive?`<div class="mini-clock" data-clock="m:${m.id}">${fmt(remaining(m))}</div>`:'';
    const state=m.status==='scoring'?'<span class="chip warn">بانتظار تأكيد النتيجة</span>':m.wait?`<span class="chip acc">${PER[p]} · جاهز للبدء</span>`:!m.run?`<span class="chip warn">${PER[p]} · متوقف</span>`:p==='ht'?`<span class="chip acc">بين الشوطين</span>`:`<span class="chip live">${PER[p]}</span>`;
    return `<div class="cons on"><div class="cons-head"><b>${ic('tv')} ${label}</b>${state}</div>${vsRow(L,m,true)}${clk}
      <button class="btn btn-primary btn-wide" data-act="openMatch" data-id="${m.id}">${PS.x} ${m.status==='scoring'?'سجّل النتيجة':'شاشة المباراة'}</button></div>`;
  }
  const brk=cs.breakEnd&&L.status!=='paused';
  if(!sugg) return `<div class="cons"><div class="cons-head"><b>${ic('tv')} ${label}</b><span class="chip">فارغ</span></div><p class="muted small">${pend(L).length?'كل المباريات القادمة لها لاعبون يلعبون الآن على جهاز آخر.':L.format!=='league'&&L.format!=='double'&&!E.isComplete(L)?'بانتظار نتائج الدور الحالي لتحديد المتأهلين.':'لا توجد مباريات متبقية.'}</p></div>`;
  return `<div class="cons"><div class="cons-head"><b>${ic('tv')} ${label}</b>${brk?'<span class="chip acc">استراحة</span>':'<span class="chip ok">جاهز</span>'}</div>
    <span class="eyebrow">${matchTitle(L,sugg)}</span>${vsRow(L,sugg,false)}
    ${brk?`<div class="mini-clock" data-clock="c:${c}">${fmt(cs.breakEnd-now())}</div>`:''}
    <button class="btn btn-primary btn-wide" data-act="start" data-id="${sugg.id}" data-c="${c}" ${L.status==='paused'?'disabled':''}>${ic('whistle')} ${brk?'ابدأ الآن':'صافرة البداية'}</button></div>`;
}
function matchTitle(L,m){const i=L.matches.indexOf(m);return 'المباراة '+(i+1)+(roundLabel(L,m)?' · '+roundLabel(L,m):'');}
function miniTable(L){
  if(L.format==='ko'||(L.format==='groups'&&L.ko)) return bracketCard(L,true);

   <div class="lb">${rows.map(r=>`<div class="lb-row"><span class="rk">${r.g!=null?GROUP_NAMES[r.g]+r.rank:r.rank}</span>${badge(L,r.id,'sm')}<span class="who"><span>${esc(pname(L,r.id))}</span><small>لعب ${r.P} · فارق ${r.GD>0?'+':''}${r.GD}</small></span><b>${r.Pts}</b></div>`).join('')}</div></div>`;

function recentCard(L){
  const d=L.matches.filter(m=>m.status==='done').sort((a,b)=>(b.finishedAt||0)-(a.finishedAt||0)).slice(0,4);

}
function resRow(L,m){const w=E.winner(m);return `<div class="mt"><div class="p ${w===m.a?'w':''}">${badge(L,m.a,'sm')}<span>${esc(pname(L,m.a))}</span></div><span class="sc">${m.sb} - ${m.sa}${m.pa!=null&&m.sa===m.sb?`<small class="muted"> (${m.pb}-${m.pa})</small>`:''}</span><div class="p b ${w===m.b?'w':''}">${badge(L,m.b,'sm')}<span>${esc(pname(L,m.b))}</span></div></div>`;}
function installBanner(){if(!canInstall()||DB.prefs.installHide)return '';return `<div class="banner acc"><div><b>ثبّت كأس الكنترولر</b><p class="small muted">يفتح كتطبيق ويعمل بدون إنترنت.</p></div><div class="row"><button class="btn btn-primary" data-act="install">${ic('download')} تثبيت</button><button class="icon-btn" data-act="installHide" aria-label="إخفاء">${ic('x')}</button></div></div>`;}

/* ---- match screen ---- */
function vMatch(L){
  const m=byId(L,ui.matchId);

    const free=freeConsoles(L),busy=busyIds(L),blocked=busy.has(m.a)||busy.has(m.b);

     ${blocked?'<div class="note warn">أحد اللاعبين يلعب الآن على جهاز آخر. انتظر انتهاء مباراته.</div>':''}
     ${free.length?`<div class="ctrl-row">${free.map(c=>`<button class="btn btn-primary btn-xl" data-act="start" data-id="${m.id}" data-c="${c}" ${blocked||L.status==='paused'?'disabled':''}>${ic('whistle')} ابدأ ${L.consoleCount>1?'على جهاز '+c:'المباراة'}</button>`).join('')}</div>`:'<div class="note">كل الأجهزة مشغولة الآن.</div>'}`;
  }
  if(m.status==='done'||m.status==='cancelled') return `<div class="sec-head"><h2>${m.status==='done'?'انتهت المباراة':'مباراة ملغاة'}</h2><button class="btn btn-sm" data-act="go" data-v="home">رجوع ${PS.o}</button></div>${hud(L,m)}${timeline(L,m)}<button class="btn" data-act="openDetails" data-id="${m.id}">${ic('edit')} تفاصيل وتصحيح النتيجة</button>`;
  const head=`<div class="sec-head"><div><span class="eyebrow">${matchTitle(L,m)}${L.consoleCount>1?' · جهاز '+m.console:''}</span><h2>${m.status==='scoring'?'تأكيد النتيجة':PER[m.period]}</h2></div><button class="btn btn-sm" data-act="go" data-v="home">الأجهزة ${PS.o}</button></div>`;
  if(m.status==='scoring') return pausedBanner(L)+head+`<div class="mscreen"><div class="stack">${hud(L,m)}${scoringPanel(L,m,'live')}</div><div class="stack">${timeline(L,m,'live')}${statsPanel(L,m)}</div></div>`;
  const r=remaining(m),locked=L.status==='paused',p=m.period;
  const clockCls=m.wait?'':(r<=30000&&p!=='ht'?'low':'');
  let ctrl;
  if(m.wait) ctrl=`<button class="btn btn-primary btn-xl" data-act="startPeriod" ${locked?'disabled':''}>${ic('whistle')} ابدأ ${PER[p]}</button>`;
  else if(p==='ht') ctrl=`<div class="ctrl-row"><button class="btn btn-primary btn-xl" data-act="skipHT">${ic('skip')} ابدأ الشوط الثاني الآن</button><button class="btn btn-xl" data-act="adj" data-ms="30000">${ic('plus')} 30 ثانية استراحة</button></div>`;
  else if(m.run) ctrl=`<div class="ctrl-row"><button class="btn btn-xl" data-act="pause">${ic('pause')} إيقاف مؤقت</button><button class="btn btn-danger btn-xl" data-act="endPeriod">${ic('flag')} إنهاء ${PER_SHORT[p]==='ش1'?'الشوط':PER_SHORT[p]==='ش2'?'الشوط':'الوقت'}</button></div>`;
  else ctrl=`<div class="ctrl-row"><button class="btn btn-primary btn-xl" data-act="resume" ${locked?'disabled':''}>${ic('play')} استئناف</button><button class="btn btn-danger btn-xl" data-act="endPeriod">${ic('flag')} إنهاء الشوط</button></div>`;
  const adj=!m.wait&&p!=='ht'?`<div class="adj"><button class="btn" data-act="adj" data-ms="-30000">−30ث</button><button class="btn" data-act="adj" data-ms="-10000">−10ث</button><button class="btn" data-act="adj" data-ms="10000">+10ث</button><button class="btn" data-act="adj" data-ms="30000">+30ث</button></div>`:'';
  const pers=perList(L,m),pi=pers.indexOf(p==='ht'?'h1':p);
  const bars=`<div class="periods" style="--n:${pers.length}">${pers.map((x,i)=>`<span class="${i<pi||(p==='ht'&&i===0)?'done':i===pi&&p!=='ht'&&!m.wait?'now':''}" ${i===pi&&p!=='ht'?`data-prog="m:${m.id}"`:''}></span>`).join('')}</div>`;
  return pausedBanner(L)+head+`<div class="mscreen"><div class="stack">${hud(L,m)}
   <div class="clock-card"><div class="split"><span class="chip ${m.run&&p!=='ht'?'live':'acc'}">${m.wait?PER[p]+' · بانتظار البداية':PER[p]}</span><span class="eyebrow num">${p==='ht'?'استراحة '+fmt(m.dur):'الشوط '+fmt(m.dur)}</span></div>
    <div class="clock-xl ${clockCls}" data-clock="m:${m.id}">${fmt(remaining(m)||(m.wait?m.rem:0))}</div>${bars}${ctrl}${adj}</div></div>
   <div class="stack">${goalButtons(L,m)}${timeline(L,m,'live')}<button class="btn btn-danger" data-act="endMatch">${ic('stop')} إنهاء المباراة الآن</button></div></div>`;
}
function freeConsoles(L){const a=[];for(let c=1;c<=L.consoleCount;c++)if(!consoleMatch(L,c))a.push(c);return a;}
function hud(L,m){
  const pa=pl(L,m.a)||{},pb=pl(L,m.b)||{},showPk=m.pa!=null&&m.sa===m.sb&&isKO(m)&&(m.status==='done'||m.status==='scoring');

  return `<div class="hud"><div class="hud-strip">
   <div class="hud-side a" style="--c:${pa.color||'#555'}">${badge(L,m.a,'lg')}<span class="hud-name"><b>${esc(pa.name||'—')}</b><small>${esc(pa.club||'')}</small></span></div>
   <div class="hud-score">${showPk?`<span class="pk">(${m.pb})</span>`:''}<span>${m.sb}</span><i>-</i><span>${m.sa}</span>${showPk?`<span class="pk">(${m.pa})</span>`:''}</div>
   <div class="hud-side b" style="--c:${pb.color||'#555'}">${badge(L,m.b,'lg')}<span class="hud-name"><b>${esc(pb.name||'—')}</b><small>${esc(pb.club||'')}</small></span></div>
  </div><div class="hud-clock">${per}</div></div>`;
}
function goalButtons(L,m){
  return `<div class="goal-btns">${['a','b'].map(s=>{const p=pl(L,m[s]);return `<button class="gbtn" data-act="goal" data-s="${s}" style="--c:${p.color}"><span class="plus">${ic('plus')}</span><span style="min-width:0"><b>هدف ${esc(p.name)}</b><small>${m.events.filter(e=>e.side===s).length} حتى الآن</small></span></button>`;}).join('')}</div>`;
}
function timeline(L,m,t){
  const ev=m.events.slice().sort((x,y)=>(x.min||0)-(y.min||0));
  return `<div class="card"><div class="split"><h3>الأهداف</h3>${t?`<label class="chk" style="padding:0;font-size:13px"><input type="checkbox" id="gp" data-in="set.goalPrompt" ${L.goalPrompt!==false?'checked':''}><span>اسأل عن اسم الهداف</span></label>`:''}</div>
   ${ev.length?`<div class="tl">${ev.map(e=>`<div class="tl-row ${e.side}"><span class="min">${e.min!=null?e.min+"'":'—'}</span><span class="who">${badge(L,m[e.side],'sm')}<span>${esc(e.name||pname(L,m[e.side]))}${e.name?`<small class="muted"> · ${esc(pname(L,m[e.side]))}</small>`:''}${e.og?' <small class="muted">(في مرماه)</small>':''}</span></span>${t?`<button class="icon-btn" data-act="goalDel" data-t="${t}" data-id="${e.id}" aria-label="حذف الهدف">${ic('trash')}</button>`:'<span></span>'}</div>`).join('')}</div>`:'<p class="muted small">لا أهداف بعد.</p>'}</div>`;
}
function scoringPanel(L,m,t){

  const side=s=>`<div class="side">${badge(L,m[s])}<b class="n">${esc(pname(L,m[s]))}</b><div class="stepper"><button data-act="sc" data-t="${t}" data-s="${s}" data-d="-1" aria-label="إنقاص" ${m['s'+s]<=0?'disabled':''}>${ic('minus')}</button><b>${m['s'+s]}</b><button data-act="sc" data-t="${t}" data-s="${s}" data-d="1" aria-label="زيادة">${ic('plus')}</button></div></div>`;

  return `<div class="card"><h3>النتيجة النهائية</h3><div class="score-edit">${side('a')}${side('b')}</div><p class="hint">عدّل النتيجة إذا لم تسجّل كل الأهداف أثناء اللعب.</p></div>${pk}
   ${errs.length?`<div class="errs">${errs.map(e=>`<div><b>!</b> ${esc(e)}</div>`).join('')}</div>`:''}

}
function statsPanel(L,m){
  const st=m.st||{};
  return `<div class="card"><h3>إحصائيات المباراة <span class="muted small">(اختياري)</span></h3><p class="hint">انقلها من شاشة نهاية المباراة في اللعبة.</p>
   <div class="range"><div class="split"><span class="lbl">الاستحواذ</span><span class="num">${st.pos!=null?`${esc(pname(L,m.a))} ${st.pos}% · ${100-st.pos}% ${esc(pname(L,m.b))}`:'غير مسجّل'}</span></div><input type="range" id="st-pos" min="0" max="100" step="1" value="${st.pos!=null?st.pos:50}" data-in="st.pos" aria-label="استحواذ ${esc(pname(L,m.a))}"></div>
   <div class="grid2"><div class="field"><label for="st-sha">تسديدات ${esc(pname(L,m.a))}</label><input type="number" id="st-sha" min="0" max="99" value="${st.sha!=null?st.sha:''}" data-in="st.sha" inputmode="numeric"></div><div class="field"><label for="st-shb">تسديدات ${esc(pname(L,m.b))}</label><input type="number" id="st-shb" min="0" max="99" value="${st.shb!=null?st.shb:''}" data-in="st.shb" inputmode="numeric"></div></div></div>`;

function validate(L,m){
  const e=[];['a','b'].forEach(s=>{const v=m['s'+s];if(!Number.isInteger(v)||v<0||v>99)e.push('النتيجة يجب أن تكون بين 0 و99.');if(m.events.filter(x=>x.side===s).length>v)e.push('عدد الأهداف المسجّلة بالأسماء أكبر من نتيجة '+pname(L,m[s])+'. احذف هدفاً من القائمة.');});
  if(isKO(m)&&m.sa===m.sb){if(m.pa==null||m.pb==null||m.pa===m.pb)e.push('التعادل في الأدوار الإقصائية يُحسم بركلات الترجيح: أدخل نتيجة ترجيح غير متعادلة.');}
  return e;
}

/* ---- schedule ---- */
function vSchedule(L){
  const t=totals(L),f=ui.tab.sched||'all',sugg=new Set(Object.values(consoleSuggestions(L)).filter(Boolean).map(m=>m.id));
  let list=L.matches.map((m,i)=>({m,i}));
  if(f==='next')list=list.filter(x=>x.m.status==='pending'||isActive(x.m));if(f==='done')list=list.filter(x=>x.m.status==='done');
  let out=`<div class="sec-head"><h2>المباريات</h2><span class="chip num">${t.done}/${t.total}</span></div>
   <div class="tabs">${[['all','الكل'],['next','القادمة'],['done','المنتهية']].map(([k,l])=>`<button data-act="tab" data-g="sched" data-k="${k}" aria-pressed="${f===k}">${l}</button>`).join('')}</div>`;
  if(L.format==='league'||L.format==='double') out+=`<button class="btn" data-act="addMatches">${ic('plus')} إضافة مباريات للبطولة</button>`;
  if(L.format==='groups'&&!L.ko) out+=`<div class="note">بعد انتهاء دور المجموعات يتأهل ${L.qualify===1?'الأول':'الأول والثاني'} من كل مجموعة، وتظهر مباريات خروج المغلوب هنا تلقائياً.</div>`;
  const byes=Object.keys(L.byes||{});
  if(byes.length&&f!=='done') out+=`<div class="note">العدد فردي، فيرتاح لاعب في كل جولة: ${byes.slice(0,8).map(r=>'ج'+r+': '+esc(pname(L,L.byes[r]))).join(' · ')}</div>`;
  out+=list.length?`<div class="mlist">${list.map(({m,i})=>mrow(L,m,i,sugg.has(m.id))).join('')}</div>`:'<div class="card"><p class="muted">لا مباريات في هذا القسم.</p></div>';
  return out;
}
function mrow(L,m,i,isNext){
  const show=m.status!=='pending'&&m.status!=='cancelled',w=m.status==='done'?E.winner(m):null;
  const chip=m.status==='done'?'<span class="chip ok">انتهت</span>':m.status==='live'?`<span class="chip live">${PER[m.period]}${L.consoleCount>1?' · جهاز '+m.console:''}</span>`:m.status==='scoring'?'<span class="chip warn">بانتظار التأكيد</span>':m.status==='cancelled'?'<span class="chip">ملغاة</span>':isNext?'<span class="chip acc">التالية</span>':'';
  return `<div class="mrow ${isActive(m)?'live':isNext?'next':m.status==='cancelled'?'cancel':''}"><button class="mmain" data-act="openDetails" data-id="${m.id}"><span class="mno">${i+1}</span><span class="mbody">
   <span class="mt"><span class="p ${w===m.a?'w':''}">${badge(L,m.a,'sm')}<span>${esc(pname(L,m.a))}</span></span><span class="sc ${show?'':'vs'}">${show?m.sb+' - '+m.sa:'ضد'}</span><span class="p b ${w===m.b?'w':''}">${badge(L,m.b,'sm')}<span>${esc(pname(L,m.b))}</span></span></span>
   <span class="mmeta">${chip}<span>${esc(roundLabel(L,m))}</span>${m.status==='done'&&m.pa!=null&&m.sa===m.sb?`<span class="chip">ترجيح ${m.pb}-${m.pa}</span>`:''}</span></span></button>
   ${m.status==='pending'?`<span class="arrows"><button class="icon-btn" data-act="mv" data-id="${m.id}" data-d="-1" aria-label="تقديم">${ic('up')}</button><button class="icon-btn" data-act="mv" data-id="${m.id}" data-d="1" aria-label="تأخير">${ic('down')}</button></span>`:'<span></span>'}</div>`;
}

/* ---- standings ---- */
function vStandings(L){
  let out=`<div class="sec-head"><h2>الترتيب</h2></div>`;
  if(L.format==='league'||L.format==='double') return out+tableHtml(L,E.table(L,L.players.map(p=>p.id),L.matches),{champ:L.status==='done'&&!L.endedManually})+rulesNote(L)+`<button class="btn" data-act="exportCsv">${ic('download')} تصدير CSV</button>`;
  if(L.format==='ko') return out+bracketCard(L,false)+`<button class="btn" data-act="exportCsv">${ic('download')} تصدير CSV</button>`;
  const tab=ui.tab.stand||(L.ko?'ko':'groups');
  out+=`<div class="tabs"><button data-act="tab" data-g="stand" data-k="groups" aria-pressed="${tab==='groups'}">المجموعات</button><button data-act="tab" data-g="stand" data-k="ko" aria-pressed="${tab==='ko'}" ${L.ko?'':'disabled'}>خروج المغلوب</button></div>`;
  if(tab==='ko'&&L.ko) return out+bracketCard(L,false);
  return out+groupTables(L).map((t,gi)=>`<div class="stack"><h3>المجموعة ${GROUP_NAMES[gi]}</h3>${tableHtml(L,t,{q:L.qualify})}</div>`).join('')+rulesNote(L);
}
function tableHtml(L,rows,o){
  o=o||{};
  return `<div class="tbl-wrap"><table><thead><tr><th>#</th><th style="text-align:right">اللاعب</th><th>لعب</th><th>ف</th><th>ت</th><th>خ</th><th>له</th><th>عليه</th><th>±</th><th>النقاط</th><th>آخر 5</th></tr></thead><tbody>
  ${rows.map(r=>`<tr class="${o.q&&r.rank<=o.q?'q':''} ${o.champ&&r.rank===1?'top':''}"><td>${r.rank}${r.tied?'=':''}</td><td class="name"><span class="in">${badge(L,r.id,'sm')}<span>${esc(pname(L,r.id))}<small>${esc(sub(L,r.id))}</small></span>${o.champ&&r.rank===1?'<span class="chip gold">البطل</span>':''}</span></td><td>${r.P}</td><td>${r.W}</td><td>${r.D}</td><td>${r.L}</td><td>${r.GF}</td><td>${r.GA}</td><td class="ltr">${r.GD>0?'+':''}${r.GD}</td><td class="pts">${r.Pts}</td><td>${formHtml(r.form)}</td></tr>`).join('')}
  </tbody></table></div>`;
}
const formHtml=f=>`<span class="form">${f.slice().reverse().map(x=>`<i class="${x}">${x==='W'?'ف':x==='D'?'ت':'خ'}</i>`).join('')}</span>`;
function rulesNote(L){const P=L.points;return `<div class="note">الترتيب حسب النقاط، ثم فارق الأهداف، ثم الأهداف المسجلة، ثم المواجهات المباشرة. فوز ${P.win} · تعادل ${P.draw} · خسارة ${P.loss}.${L.format==='groups'?' الخط الأخضر يعني التأهل.':''}</div>`;}
function bracketCard(L,mini){
  const rounds=E.koRounds(L);if(!rounds.length)return '';
  const R=rounds.length-1;let cols='';
  const startR=mini?Math.max(0,R-2):0;
  for(let r=startR;r<R;r++){let boxes='';
    for(let k=0;k<rounds[r].length/2;k++){const a=rounds[r][2*k],b=rounds[r][2*k+1];if(a===null&&b===null)continue;
      const m=L.matches.find(x=>x.ko&&x.ko.r===r&&x.ko.k===k),w=m&&m.status==='done'?E.winner(m):(a===null?b:b===null?a:undefined);
      const line=(id,sc)=>`<div class="${id===undefined?'tbd':''} ${w&&id===w?'w':''}"><span class="nm">${id?badge(L,id,'sm'):''}<span>${esc(pname(L,id))}</span></span><span class="num">${sc==null?'':sc}</span></div>`;
      const done=m&&m.status==='done';
      boxes+=`<div class="bm">${line(a,done?m.sa+(m.sa===m.sb&&m.pa!=null?' ('+m.pa+')':''):null)}${line(b,done?m.sb+(m.sa===m.sb&&m.pb!=null?' ('+m.pb+')':''):null)}</div>`;}
    cols+=`<div class="bcol"><h4>${E.koRoundName(r,R)}</h4>${boxes}</div>`;}
  const c=rounds[R][0];
  cols+=`<div class="bcol"><h4>البطل</h4><div class="bm"><div class="${typeof c==='string'?'w':'tbd'}"><span class="nm">${typeof c==='string'?badge(L,c,'sm'):''}<span>${typeof c==='string'?esc(pname(L,c)):'بعد النهائي'}</span></span>${typeof c==='string'?ic('trophy'):''}</div></div></div>`;
  return `<div class="card"><div class="split"><h3>شجرة خروج المغلوب</h3>${mini?`<button class="btn btn-sm" data-act="go" data-v="standings">كاملة</button>`:''}</div><div class="bracket">${cols}</div>${mini?'':'<p class="hint">التعادل يُحسم '+(L.extraTime?'بشوطين إضافيين ثم ':'')+'بركلات الترجيح.</p>'}</div>`;
}

/* ---- stats ---- */
function vStats(L){
  const G=E.gamerStats(L),done=L.matches.filter(m=>m.status==='done');
  let out=`<div class="sec-head"><h2>الإحصائيات</h2></div>`;
  if(!done.length) return out+'<div class="card"><h3>لا مباريات منتهية بعد</h3><p class="muted">تظهر هنا الجوائز والأرقام بعد تأكيد أول نتيجة.</p></div>';
  const tab=ui.statsTab;
  out+=`<div class="tabs">${[['gamers','اللاعبون'],['scorers','الهدافون في اللعبة'],['h2h','المواجهات المباشرة']].map(([k,l])=>`<button data-act="statsTab" data-k="${k}" aria-pressed="${tab===k}">${l}</button>`).join('')}</div>`;
  if(tab==='scorers'){const S=E.scorers(L);return out+(S.length?`<div class="card"><h3>هدافو اللعبة</h3><div class="lb">${S.slice(0,30).map((r,i,a)=>`<div class="lb-row"><span class="rk">${a.findIndex(x=>x.G===r.G)+1}</span>${badge(L,r.pid,'sm')}<span class="who"><span>${esc(r.name)}</span><small>مع ${esc(pname(L,r.pid))}</small></span><b>${r.G}</b></div>`).join('')}</div></div>`:'<div class="card"><p class="muted">لم تُسجَّل أسماء هدافين بعد. فعّل «اسأل عن اسم الهداف» في شاشة المباراة.</p></div>');}
  if(tab==='h2h') return out+h2hMatrix(L);
  const act=G.filter(g=>g.P>0),by=(f,dir)=>act.slice().sort((a,b)=>dir*(f(b)-f(a)))[0];
  const aw=[];
  const add=(icon,label,g,val,note)=>{if(g)aw.push(`<div class="award"><span class="lbl">${ic(icon)} ${label}</span><span class="row">${badge(L,g.id,'sm')}<b>${esc(pname(L,g.id))}</b></span><small>${val}${note?' · '+note:''}</small></div>`);};
  const atk=by(g=>g.GF,1);add('fire','أقوى هجوم',atk,atk.GF+' هدف');
  const def=act.slice().sort((a,b)=>(a.GA/a.P)-(b.GA/b.P)||b.P-a.P)[0];add('shield','أقوى دفاع',def,def.GA+' هدف عليه في '+def.P+' مباريات');
  const cs=by(g=>g.CS,1);if(cs.CS)add('shield','شباك نظيفة',cs,cs.CS+' مباراة');
  const st=by(g=>g.bestStreak,1);if(st.bestStreak>1)add('bolt','أطول سلسلة انتصارات',st,st.bestStreak+' متتالية');
  const big=act.filter(g=>g.best&&g.best.diff>0).sort((a,b)=>b.best.diff-a.best.diff||b.best.f-a.best.f)[0];if(big)add('star','أكبر فوز',big,big.best.f+'-'+big.best.a+' على '+esc(pname(L,big.best.m.a===big.id?big.best.m.b:big.best.m.a)));
  const ps=act.filter(g=>g.pos.length).sort((a,b)=>avg(b.pos)-avg(a.pos))[0];if(ps)add('pad','أعلى استحواذ',ps,Math.round(avg(ps.pos))+'% في المتوسط');
  out+=`<div class="awards">${aw.join('')}</div>`;
  const rows=act.slice().sort((a,b)=>b.GF-a.GF||(b.GF-b.GA)-(a.GF-a.GA));
  out+=`<div class="card"><h3>أرقام اللاعبين</h3><div class="tbl-wrap"><table><thead><tr><th style="text-align:right">اللاعب</th><th>لعب</th><th>فوز %</th><th>أهداف</th><th>معدل</th><th>عليه</th><th>نظيفة</th><th>استحواذ</th><th>تسديد</th></tr></thead><tbody>
   ${rows.map(g=>`<tr><td class="name"><span class="in">${badge(L,g.id,'sm')}<span>${esc(pname(L,g.id))}<small>${esc(sub(L,g.id))}</small></span></span></td><td>${g.P}</td><td>${Math.round(100*g.W/g.P)}%</td><td>${g.GF}</td><td>${(g.GF/g.P).toFixed(1)}</td><td>${g.GA}</td><td>${g.CS}</td><td>${g.pos.length?Math.round(avg(g.pos))+'%':'<span class="muted">—</span>'}</td><td>${g.shots||'<span class="muted">—</span>'}</td></tr>`).join('')}</tbody></table></div><p class="hint">«—» تعني أن الرقم لم يُسجَّل في إحصائيات المباريات، وليست صفراً.</p></div>`;
  return out;
}
const avg=a=>a.reduce((x,y)=>x+y,0)/(a.length||1);
function h2hMatrix(L){
  const P=L.players;
  return `<div class="card"><h3>من فاز على من</h3><p class="hint">كل خانة: انتصارات - تعادلات - خسائر صاحب الصف أمام صاحب العمود.</p><div class="tbl-wrap h2h"><table><thead><tr><th></th>${P.map(p=>`<th>${badge(L,p.id,'sm')}</th>`).join('')}</tr></thead><tbody>
  ${P.map(a=>`<tr><td class="name"><span class="in">${badge(L,a.id,'sm')}<span>${esc(a.name)}</span></span></td>${P.map(b=>{if(a.id===b.id)return '<td class="self"></td>';const r=E.h2h(L,a.id,b.id);return `<td class="c">${r.P?`<span class="w">${r.W}</span>-${r.D}-<span class="l">${r.L}</span>`:'<span class="muted">·</span>'}</td>`;}).join('')}</tr>`).join('')}</tbody></table></div></div>`;
}

   <h3 style="font-size:19px">أمام كل منافس</h3><div class="res-list">${others.map(o=>{const r=E.h2h(L,id,o.id);return `<div class="res" style="grid-template-columns:auto 1fr auto">${badge(L,o.id,'sm')}<span>${esc(o.name)}</span><span class="s">${r.P?r.W+'-'+r.D+'-'+r.L:'—'}</span></div>`;}).join('')}</div>`;

  ${hall.length?`<div class="card"><h3>قاعة المشاهير</h3><p class="hint">أرقام كل البطولات على هذا الجهاز، مجمّعة حسب اسم اللاعب.</p><div class="tbl-wrap"><table><thead><tr><th style="text-align:right">اللاعب</th><th>ألقاب</th><th>بطولات</th><th>لعب</th><th>فوز</th><th>أهداف</th><th>فوز %</th></tr></thead><tbody>${hall.map(h=>`<tr><td class="name">${esc(h.name)}</td><td>${h.titles?`<span class="chip gold">${h.titles}</span>`:'0'}</td><td>${h.leagues}</td><td>${h.P}</td><td>${h.W}</td><td>${h.GF}</td><td>${h.P?Math.round(100*h.W/h.P)+'%':'—'}</td></tr>`).join('')}</tbody></table></div></div>`:''}`;
}
function allTime(){
  const m=new Map();
  DB.leagues.forEach(L=>{const G=E.gamerStats(L),ch=L.status==='done'&&!L.endedManually?championIds(L):[];
    L.players.forEach(p=>{const k=p.name.trim();const h=m.get(k)||{name:k,titles:0,leagues:0,P:0,W:0,GF:0};const g=G.find(x=>x.id===p.id);h.leagues++;h.P+=g.P;h.W+=g.W;h.GF+=g.GF;if(ch.length===1&&ch[0]===p.id)h.titles++;m.set(k,h);});});
  return [...m.values()].filter(h=>h.P>0).sort((a,b)=>b.titles-a.titles||b.W-a.W||b.GF-a.GF);
}
function championIds(L){
  if(L.format==='league'||L.format==='double'){const t=E.table(L,L.players.map(p=>p.id),L.matches);return t.filter(r=>r.rank===1&&r.P>0).map(r=>r.id);}
  const r=E.koRounds(L);if(!r.length)return [];const c=r[r.length-1][0];return typeof c==='string'?[c]:[];
}
function championNames(L){return championIds(L).map(id=>pname(L,id));}

/* ---- champion ---- */
function vChampion(L){
  const ids=championIds(L),G=E.gamerStats(L);let podium=[],rest=[];
  if(L.format==='league'||L.format==='double'){const t=E.table(L,L.players.map(p=>p.id),L.matches);podium=t.filter(r=>r.rank>1).slice(0,2).map(r=>({t:r.rank===2?'الوصيف':'المركز '+r.rank,id:r.id,v:r.Pts+' نقطة'}));rest=t.map(r=>({rank:r.rank+(r.tied?'=':''),id:r.id,info:r.Pts+' نقطة · '+r.W+' فوز · فارق '+(r.GD>0?'+':'')+r.GD}));}
  else {const r=E.koRanking(L);podium=r.filter(x=>x.rank>1).slice(0,3).map(x=>({t:x.label,id:x.id,v:''}));rest=r.map(x=>({rank:x.rank,id:x.id,info:x.label}));
    const seen=new Set(rest.map(x=>x.id));L.players.filter(p=>!seen.has(p.id)).forEach(p=>rest.push({rank:'—',id:p.id,info:'خرج من دور المجموعات'}));}
  const act=G.filter(g=>g.P),atk=act.slice().sort((a,b)=>b.GF-a.GF)[0],sc=E.scorers(L)[0];
  const title=L.endedManually?'المتصدر عند الإنهاء':ids.length>1?'تعادل على اللقب':'بطل '+L.name;
  return `<section class="champ">${TROPHY}<span class="eyebrow">${esc(title)}</span><h1>${ids.map(id=>esc(pname(L,id))).join('<br>')||'—'}</h1>${ids.length===1&&sub(L,ids[0])?`<p>${esc(sub(L,ids[0]))}</p>`:''}
   ${podium.length?`<div class="podium">${podium.map(p=>`<div><small>${esc(p.t)}</small><b>${esc(pname(L,p.id))}</b>${p.v?`<small>${p.v}</small>`:''}</div>`).join('')}</div>`:''}
   <div class="podium">${atk?`<div><small>أقوى هجوم</small><b>${esc(pname(L,atk.id))}</b><small>${atk.GF} هدف</small></div>`:''}${sc?`<div><small>هداف اللعبة</small><b>${esc(sc.name)}</b><small>${sc.G} أهداف مع ${esc(pname(L,sc.pid))}</small></div>`:''}</div></section>
  <div class="card"><h3>الترتيب النهائي</h3><div class="lb">${rest.map(r=>`<div class="lb-row"><span class="rk">${r.rank}</span>${badge(L,r.id,'sm')}<span class="who"><span>${esc(pname(L,r.id))}</span><small>${esc(r.info)}</small></span><span></span></div>`).join('')}</div></div>
  <div class="ctrl-row"><button class="btn" data-act="go" data-v="stats">${ic('chart')} الإحصائيات</button><button class="btn" data-act="exportCsv">${ic('download')} CSV</button>${L.format==='league'||L.format==='double'?`<button class="btn" data-act="addMatches">${ic('plus')} مباريات إضافية</button>`:''}<button class="btn btn-primary" data-act="newLeague">${ic('plus')} بطولة جديدة</button></div>`;
}

function addSheet(L){

/* ---------- live painting ---------- */
function paint(){
  const L=cur();if(!L)return;
  document.querySelectorAll('[data-clock]').forEach(el=>{const [k,id]=el.dataset.clock.split(':');
    if(k==='m'){const m=byId(L,id);if(!m)return;const r=remaining(m)||(m.wait?m.rem:0);el.textContent=fmt(r);if(el.classList.contains('clock-xl'))el.classList.toggle('low',!m.wait&&m.period!=='ht'&&r<=30000&&r>0);}
    else{const c=(L.cons||[])[+id-1];el.textContent=fmt(c&&c.breakEnd?c.breakEnd-now():0);}});
  document.querySelectorAll('[data-prog]').forEach(el=>{const m=byId(L,el.dataset.prog.split(':')[1]);if(!m||m.wait)return;el.style.setProperty('--p',Math.min(100,100*(1-remaining(m)/(m.dur||1)))+'%');});
}
function tick(){
  const L=cur();if(!L)return;let ch=false;
  if(L.status!=='paused'&&L.status!=='done'){
    L.matches.forEach(m=>{if(m.status==='live'&&m.run&&now()>=m.endAt){const fin=advance(L,m);alarm(fin?'end':'half');ui.flash={k:'period',mid:m.id};ch=true;}});
    (L.cons||[]).forEach((c,i)=>{if(c&&c.breakEnd&&now()>=c.breakEnd){c.breakEnd=null;if(!consoleMatch(L,i+1)&&consoleSuggestions(L)[i+1]){alarm('ready');ui.flash={k:'ready',c:i+1};}ch=true;}});
  }
  if(ch){save();render();syncWake();return;}
  paint();
}
/* end the current period; returns true when the match reached full time */
function advance(L,m){
  const p=m.period,set=(np,wait)=>{m.period=np;m.dur=periodDur(L,np);m.wait=!!wait;m.run=!wait;m.rem=m.dur;m.endAt=wait?null:now()+m.dur;};
  if(p==='h1'){if(L.htSec>0)set('ht',false);else set('h2',true);return false;}
  if(p==='ht'){set('h2',true);return false;}
  const draw=m.sa===m.sb;
  if(p==='h2'&&isKO(m)&&draw&&L.extraTime){m.etPlayed=true;set('et1',true);return false;}
  if(p==='et1'){set('et2',true);return false;}
  toScoring(m,false);return true;
}
function toScoring(m,manual){const left=m.status==='live'?remaining(m):0;m.status='scoring';m.leftMs=manual?left:0;m.leftPer=manual?m.period:null;m.run=false;m.endAt=null;m.rem=0;m.finishedAt=now();if(isKO(m)&&m.sa===m.sb){if(m.pa==null)m.pa=0;if(m.pb==null)m.pb=0;}}
