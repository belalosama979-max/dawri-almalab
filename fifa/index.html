A.replay=d=>{const L=cur(),m=byId(L,d.id);if(!m)return;
  if(isKO(m)){const nx=L.matches.find(x=>x.ko&&x.ko.r===m.ko.r+1&&x.ko.k===(m.ko.k>>1));if(nx&&nx.status!=='pending')return toast('مباراة الدور التالي بدأت.');}
  confirmBox({title:'إعادة المباراة؟',text:'تُمسح النتيجة والأهداف وتصبح المباراة التالية.',yes:'إعادة',danger:true,onYes:()=>{
    Object.assign(m,newMatch(m.a,m.b,{id:m.id,stage:m.stage,group:m.group,round:m.round,leg:m.leg,ko:m.ko,extra:m.extra,extraRound:m.extraRound}));
    if(m.stage==='group'&&L.ko&&!L.matches.some(x=>x.stage==='ko'&&x.status!=='pending')){L.ko=null;L.matches=L.matches.filter(x=>x.stage!=='ko');}
    if(L.ko)E.koSync(L,newMatch);
    if(L.status==='done'){L.status='running';L.endedManually=false;}moveToFront(L,m);ui.edit=null;commit();}});};
A.cancelMatch=d=>{const L=cur(),m=byId(L,d.id);if(!m)return;confirmBox({title:'إلغاء المباراة؟',text:'لن تُحتسب. يمكن استعادتها لاحقاً.',yes:'إلغاء المباراة',danger:true,onYes:()=>{Object.assign(m,{status:'cancelled',sa:0,sb:0,events:[],run:false,endAt:null,console:null});ui.edit=null;if(L.status!=='done'&&E.isComplete(L))return finish(L,false);commit();}});};
A.restore=d=>{const L=cur(),m=byId(L,d.id);m.status='pending';if(L.status==='done'){L.status='running';L.endedManually=false;}ui.sheet=null;commit();};
A.toFront=d=>{const L=cur(),m=byId(L,d.id);moveToFront(L,m);ui.sheet=null;toast('أصبحت التالية');commit();};
A.mv=d=>{const L=cur(),m=byId(L,d.id);if(!m||m.status!=='pending')return;const i=L.matches.indexOf(m),dir=Number(d.d);let j=i+dir;while(j>=0&&j<L.matches.length&&L.matches[j].status!=='pending')j+=dir;if(j<0||j>=L.matches.length)return;L.matches[i]=L.matches[j];L.matches[j]=m;commit();};
A.pauseLeague=()=>{const L=cur();L.matches.forEach(m=>{if(m.status==='live'&&m.run){m.rem=Math.max(0,m.endAt-now());m.endAt=null;m.run=false;m.autoPaused=true;}});(L.cons||[]).forEach(c=>{if(c.breakEnd){c.brRem=Math.max(0,c.breakEnd-now());c.breakEnd=null;}});L.status='paused';toast('توقفت البطولة مؤقتاً');commit();syncWake();};
A.resumeLeague=()=>{const L=cur();L.status='running';L.matches.forEach(m=>{if(m.autoPaused){m.run=true;m.endAt=now()+Math.max(1000,m.rem);delete m.autoPaused;}});(L.cons||[]).forEach(c=>{if(c.brRem!=null){c.breakEnd=now()+c.brRem;delete c.brRem;}});toast('استُؤنفت البطولة');commit();syncWake();};
A.endLeague=()=>{const L=cur(),left=totals(L).left;confirmBox({title:'إنهاء البطولة؟',text:left?'باقي '+left+' مباراة. سيُعرض الترتيب الحالي كنهائي، ويمكن المتابعة لاحقاً.':'تُغلق البطولة ويُعرض الترتيب النهائي.',yes:'إنهاء',danger:true,onYes:()=>finish(L,left>0)});};
A.reopen=()=>{const L=cur();L.status='running';L.endedManually=false;commit();};
A.setCons=d=>{const L=cur(),n=Number(d.k);const busyHigh=actives(L).some(m=>m.console>n);if(busyHigh)return toast('أنهِ المباريات الجارية على الأجهزة التي ستُزال أولاً.');L.consoleCount=n;while(L.cons.length<n)L.cons.push({breakEnd:null});L.cons.length=n;commit();};
A.theme=d=>{DB.prefs.theme=d.k;commit();};
A.testSound=()=>{unlockAudio();const s=DB.prefs.sound;DB.prefs.sound=true;alarm('end');DB.prefs.sound=s;};
A.openLeague=d=>{DB.currentId=d.id;go('home');};
A.delLeague=d=>{const L=DB.leagues.find(x=>x.id===d.id);confirmBox({title:'حذف البطولة نهائياً؟',text:'سيُحذف «'+L.name+'» بكل نتائجه من هذا الجهاز.',yes:'حذف',danger:true,onYes:()=>{DB.leagues=DB.leagues.filter(x=>x.id!==d.id);if(DB.currentId===d.id)DB.currentId=DB.leagues[0]?DB.leagues[0].id:null;commit();}});};
A.addMatches=()=>{ui.sheet={type:'addm'};renderSheet();};
A.addRound=()=>{const L=cur(),maxR=L.matches.reduce((a,m)=>Math.max(a,m.round||0),0),rr=E.roundRobin(L.players.map(p=>p.id),1),last=L.matches.filter(m=>m.status!=='cancelled').slice(-1)[0];
  E.arrange(rr.matches.map(x=>Object.assign(x,{round:x.round+maxR})),last).forEach(x=>L.matches.push(newMatch(x.a,x.b,{round:x.round,extraRound:true})));
  Object.keys(rr.byes).forEach(k=>{L.byes[+k+maxR]=rr.byes[k];});if(L.status==='done'){L.status='running';L.endedManually=false;}ui.sheet=null;toast('أُضيفت '+rr.matches.length+' مباراة');go('schedule');};
A.addOne=()=>{const L=cur(),a=$('#am-a').value,b=$('#am-b').value;if(a===b)return toast('اختر لاعبَين مختلفين.');const m=newMatch(a,b,{extra:true});L.matches.push(m);if($('#am-next').checked)moveToFront(L,m);if(L.status==='done'){L.status='running';L.endedManually=false;}ui.sheet=null;toast('أُضيفت المباراة');go('schedule');};
A.exportCsv=()=>{ui.sheet={type:'csv'};renderSheet();};
A.backup=d=>{ui.sheet={type:'backup',scope:d&&d.k==='all'?'all':(cur()?'one':'all')};renderSheet();};
A.bkScope=d=>{ui.sheet.scope=d.k;renderSheet();};
A.copyOut=d=>{const ta=$('#'+d.id),txt=ta?ta.value:'';const fb=()=>{try{ta.focus();ta.select();document.execCommand&&document.execCommand('copy');toast('حدّدنا النص، انسخه يدوياً إن لزم');}catch(e){}};try{navigator.clipboard.writeText(txt).then(()=>toast('تم النسخ'),fb);}catch(e){fb();}};
A.dlOut=d=>{try{const txt=$('#'+d.id).value,L=cur(),blob=new Blob([d.ext==='csv'?'﻿'+txt:txt],{type:d.ext==='csv'?'text/csv;charset=utf-8':'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=((L&&L.name)||'kas').replace(/[\\/:*?"<>|\s]+/g,'_')+'.'+d.ext;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}catch(e){toast('تعذّر التنزيل، استخدم النسخ.');}};
A.importOpen=()=>{ui.sheet={type:'import',text:'',err:''};renderSheet();};
A.doImport=()=>{const s=ui.sheet,txt=(($('#imp-text')||{}).value||'').trim();s.text=txt;const r=parseImport(txt);if(r.error){s.err=r.error;renderSheet();return;}
  r.leagues.slice().reverse().forEach(l=>DB.leagues.unshift(l));DB.currentId=r.leagues[0].id;ui.sheet=null;toast('استُوردت '+(r.leagues.length===1?'البطولة «'+r.leagues[0].name+'»':r.leagues.length+' بطولات'));go('home');};
A.rosterOpen=()=>{const D=DB.draft;ui.sheet={type:'roster',text:D.players.filter(p=>p.name.trim()).map(p=>p.name+(p.club?' - '+p.club:'')).join('\n'),err:''};renderSheet();};
A.useRoster=()=>{const s=ui.sheet,txt=($('#ros-text')||{}).value||'';s.text=txt;const r=E.parseRoster(txt);if(r.length<2){s.err='تحتاج لاعبَين على الأقل.';renderSheet();return;}DB.draft.players=r.slice(0,32).map((p,i)=>Object.assign(p,{color:COLORS[i%COLORS.length]}));ui.sheet=null;toast('أُضيف '+DB.draft.players.length+' لاعب');commit();};
A.install=async()=>{if(deferredInstall){const e=deferredInstall;deferredInstall=null;try{await e.prompt();}catch(x){}render();return;}ui.sheet={type:'install'};renderSheet();};
A.installHide=()=>{DB.prefs.installHide=true;commit();};

function parseImport(txt){
  if(!txt)return {error:'اختر ملفاً أو الصق البيانات.'};let d;try{d=JSON.parse(txt);}catch(e){return {error:'هذا ليس ملف نسخة احتياطية صالحاً من كأس الكنترولر.'};}
  const list=Array.isArray(d.leagues)?d.leagues:null;if(!list||!list.length)return {error:'لا توجد بطولات داخل الملف.'};
  const out=[],taken=new Set(DB.leagues.map(l=>l.id));
  list.forEach(L=>{if(!L||!Array.isArray(L.players)||!Array.isArray(L.matches)||L.players.length<2)return;const n=clone(L);
    n.matches.forEach(m=>{if(!Array.isArray(m.events))m.events=[];if(m.status==='live'){if(m.run){m.rem=Math.max(1000,(m.endAt||now())-now());}m.run=false;m.endAt=null;}});
    n.cons=Array.from({length:n.consoleCount||1},()=>({breakEnd:null}));n.points=Object.assign({win:3,draw:1,loss:0},n.points||{});
    if(!n.id||taken.has(n.id)){if(taken.has(n.id))n.name+=' (مستوردة)';n.id=uid();}taken.add(n.id);out.push(n);});
  return out.length?{leagues:out}:{error:'البيانات ناقصة أو تالفة.'};
}
function csv(L){
  const q=v=>{v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;},rows=[[L.name],[L.game+' · '+FORMAT[L.format]],[]];
  if(L.format==='league'||L.format==='double'){rows.push(['المركز','اللاعب','النادي','لعب','فاز','تعادل','خسر','له','عليه','الفارق','النقاط']);E.table(L,L.players.map(p=>p.id),L.matches).forEach(r=>rows.push([r.rank,pname(L,r.id),sub(L,r.id),r.P,r.W,r.D,r.L,r.GF,r.GA,r.GD,r.Pts]));rows.push([]);}
  rows.push(['#','المرحلة','الأول','أهداف','أهداف','الثاني','ترجيح','الحالة']);
  L.matches.forEach((m,i)=>rows.push([i+1,roundLabel(L,m),pname(L,m.a),m.status==='done'?m.sa:'',m.status==='done'?m.sb:'',pname(L,m.b),m.pa!=null&&m.status==='done'&&m.sa===m.sb?m.pa+'-'+m.pb:'',m.status]));
  const S=E.scorers(L);if(S.length){rows.push([]);rows.push(['هدافو اللعبة','مع','أهداف']);S.forEach(s=>rows.push([s.name,pname(L,s.pid),s.G]));}
  return rows.map(r=>r.map(q).join(',')).join('\n');
}

/* ---------- inputs ---------- */
function onField(el,isChange){
  const k=el.dataset.in,val=el.type==='checkbox'?el.checked:el.value,L=cur();
  if(k.indexOf('d.')===0){const f=k.slice(2);DB.draft[f]=el.type==='checkbox'?val:(['halfMin','win','draw','loss'].indexOf(f)>=0?val:val);if(f==='halfMin')DB.draft.halfMin=Number(val)||DB.draft.halfMin;DB.draft.err='';save();if(isChange&&(f==='halfMin'||el.type==='checkbox'))softRender();return;}
  if(k==='dname'||k==='dclub'){DB.draft.players[+el.dataset.i][k==='dname'?'name':'club']=val;save();if(isChange)softRender();return;}
  if(k.indexOf('pref.')===0){DB.prefs[k.slice(5)]=val;save();return;}
  if(!L)return;
  if(k.indexOf('st.')===0){const m=liveM();if(!m)return;m.st=m.st||{};const f=k.slice(3),n=parseInt(val,10);m.st[f]=isNaN(n)?null:Math.max(0,Math.min(f==='pos'?100:99,n));save();if(f==='pos'){const lab=el.closest('.range').querySelector('.num');if(lab)lab.textContent=pname(L,m.a)+' '+m.st.pos+'% · '+(100-m.st.pos)+'% '+pname(L,m.b);}return;}
  if(k.indexOf('set.')===0){const f=k.slice(4);
    if(f==='name'||f==='game'){if(val.trim()){L[f]=val.trim();save();if(isChange)softRender();}return;}
    if(f==='goalPrompt'||f==='extraTime'){L[f]=!!val;save();softRender();return;}
    if(!isChange)return;const n=Number(val);
    const lim={halfMin:[0.5,45],htSec:[0,900],breakSec:[0,1800],etMin:[0.5,15],win:[0,10],draw:[0,10],loss:[-5,10]}[f];
    if(lim&&n>=lim[0]&&n<=lim[1]){if(f==='win'||f==='draw'||f==='loss'){const P=Object.assign({},L.points,{[f]:Math.round(n)});if(!(P.win>P.draw&&P.draw>=P.loss)){toast('الفوز أكبر من التعادل، والتعادل لا يقل عن الخسارة');softRender();return;}L.points=P;toast('أُعيد حساب الترتيب');}else{L[f]=n;toast('يُطبَّق على الأشواط القادمة');}}
    else toast('قيمة غير مقبولة');save();softRender();return;}
  if(k==='pname'||k==='pclub'){const p=pl(L,el.dataset.id),v=val.trim();if(k==='pname'){if(!v)return;if(L.players.some(x=>x!==p&&x.name===v)){if(isChange)toast('الاسم مكرر');return;}p.name=v;}else p.club=v;save();if(isChange)softRender();return;}
}
function softRender(){clearTimeout(softRender._t);softRender._t=setTimeout(()=>{const a=document.activeElement,id=a&&a.id;let s0=null,s1=null;try{s0=a.selectionStart;s1=a.selectionEnd;}catch(x){}render();if(id){const el=document.getElementById(id);if(el&&el!==document.activeElement){try{el.focus({preventScroll:true});if(s0!=null)el.setSelectionRange(s0,s1);}catch(x){}}}},0);}
function readFile(input,target){const f=input.files&&input.files[0];if(!f)return;if(f.size>5e6)return toast('الملف كبير جداً.');const fr=new FileReader();fr.onload=()=>{let t=String(fr.result||'').replace(/^﻿/,'');if(target==='ros-text'&&/,/.test(t)&&/\n/.test(t))t=t.split(/\r?\n/).map(l=>l.split(',').slice(0,2).map(x=>x.replace(/^"|"$/g,'').trim()).filter(Boolean).join(' - ')).join('\n');const ta=$('#'+target);if(ta)ta.value=t;if(ui.sheet)ui.sheet.text=t;};fr.readAsText(f,'utf-8');}

/* ---------- decorative ---------- */
let heroRAF=null;
function startHeroCanvas(){
  const cv=$('#hero-cv');if(!cv||!cv.getContext)return;let ctx;try{ctx=cv.getContext('2d');}catch(e){return;}if(!ctx)return;
  cancelAnimationFrame(heroRAF);const dpr=Math.min(2,window.devicePixelRatio||1);
  const shapes=['x','o','t','s'],cols=['#7B9BFF','#FF5A6A','#2ED3A0','#F27BD8'];
  let W,H,items;const reset=()=>{W=cv.width=cv.clientWidth*dpr;H=cv.height=cv.clientHeight*dpr;items=Array.from({length:18},(_,i)=>({x:Math.random()*W,y:Math.random()*H,s:(10+Math.random()*22)*dpr,k:shapes[i%4],c:cols[i%4],v:(0.1+Math.random()*.35)*dpr,r:Math.random()*6}));};reset();
  let reduce=false;try{reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){}
  const draw=()=>{if(!document.body.contains(cv))return;ctx.clearRect(0,0,W,H);ctx.lineWidth=2.2*dpr;
    items.forEach(p=>{if(!reduce){p.y-=p.v;p.r+=.003;if(p.y<-40)p.y=H+40;}ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.strokeStyle=p.c;ctx.globalAlpha=.55;ctx.beginPath();const s=p.s;
      if(p.k==='o')ctx.arc(0,0,s/2,0,Math.PI*2);else if(p.k==='s')ctx.rect(-s/2,-s/2,s,s);else if(p.k==='t'){ctx.moveTo(0,-s/2);ctx.lineTo(s/2,s/2);ctx.lineTo(-s/2,s/2);ctx.closePath();}else{ctx.moveTo(-s/2,-s/2);ctx.lineTo(s/2,s/2);ctx.moveTo(s/2,-s/2);ctx.lineTo(-s/2,s/2);}
      ctx.stroke();ctx.restore();});if(!reduce)heroRAF=requestAnimationFrame(draw);};draw();
}
function confetti(){try{if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;}catch(e){}
  const c=document.createElement('canvas');c.id='confetti';document.body.appendChild(c);let ctx;try{ctx=c.getContext('2d');}catch(e){}if(!ctx){c.remove();return;}
  const d=window.devicePixelRatio||1,W=c.width=innerWidth*d,H=c.height=innerHeight*d,cols=['#FFC94A','#FFFFFF','#7B9BFF','#FF5A6A','#2ED3A0','#F27BD8'];
  const ps=Array.from({length:180},()=>({x:Math.random()*W,y:-Math.random()*H*.6,vx:(Math.random()-.5)*3*d,vy:(2+Math.random()*4)*d,s:(5+Math.random()*7)*d,r:Math.random()*6,vr:(Math.random()-.5)*.25,c:cols[Math.floor(Math.random()*cols.length)]})),t0=performance.now();
  (function f(t){ctx.clearRect(0,0,W,H);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore();});if(t-t0<4500)requestAnimationFrame(f);else c.remove();})(t0);}

/* ---------- wiring ---------- */
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const fn=A[b.dataset.act];if(!fn)return;unlockAudio();fn(b.dataset,b,e);});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset&&el.dataset.in&&el.type!=='checkbox'&&el.tagName!=='SELECT')onField(el,false);});
document.addEventListener('change',e=>{const el=e.target;if(el.id==='imp-file')return readFile(el,'imp-text');if(el.id==='ros-file')return readFile(el,'ros-text');if(el.dataset&&el.dataset.in)onField(el,true);});
document.addEventListener('keydown',e=>{const el=e.target;
  if(e.key==='Enter'&&el.id==='g-name'){e.preventDefault();A.gSave();}
  if(e.key==='Enter'&&el.dataset&&el.dataset.in==='dname'){e.preventDefault();const nx=$('#dc-'+el.dataset.i);if(nx)nx.focus();}
  if(e.key==='Enter'&&el.dataset&&el.dataset.in==='dclub'){e.preventDefault();const nx=$('#dn-'+(+el.dataset.i+1));if(nx)nx.focus();else A.dAdd();}
  if(e.key==='Escape'){if(ui.goal)A.gClose();else if(ui.flash)A.flashClose();else if(ui.sheet)A.closeSheet();}});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){tick();syncWake();}});
window.addEventListener('storage',e=>{if(e.key===KEY){DB=load();render();}});
render();tick();setInterval(tick,250);
window.__kas={E,A,get DB(){return DB;},tick,ui};
})();
