  confirmBox({title:'إعادة المباراة؟',text:'ستُمسح نتيجتها وإحصائياتها، وتصبح المباراة التالية في الجدول.',yes:'إعادة المباراة',danger:true,onYes:()=>{
    Object.assign(m,{status:'pending',sa:0,sb:0,pk:null,events:[],dur:null,endAt:null,remaining:null,leftMs:null,startedAt:null,finishedAt:null});
    if(L.status==='done'){L.status='running';L.endedAt=null;L.endedManually=false;}
    if(L.format==='ko')E.koSync(L);
    moveToNext(L,m);if(!L.phase||L.phase.kind==='idle'||L.phase.kind==='match')L.phase={kind:'ready'};
    ui.edit=null;toast('أُعيدت المباراة إلى الجدول كمباراة تالية');commit();
  }});
});
A.cancelMatch=d=>needAdmin(()=>{
  const L=cur(),m=byId(L,d.id);if(!m||L.format==='ko')return;
  confirmBox({title:'إلغاء المباراة؟',text:'لن تُحتسب في الترتيب ولا الإحصائيات. يمكن استعادتها لاحقاً من الجدول.',yes:'إلغاء المباراة',danger:true,onYes:()=>{
    const wasActive=ACTIVE.indexOf(m.status)>=0;
    Object.assign(m,{status:'cancelled',sa:0,sb:0,events:[],endAt:null,remaining:null,leftMs:null});
    if(wasActive)L.phase={kind:'ready'};
    ui.edit=null;
    if(L.status!=='done'&&E.isComplete(L))return finishLeague(L,false);
    commit();syncWake();
  }});
});
A.restoreMatch=d=>{const L=cur(),m=byId(L,d.id);if(!m)return;m.status='pending';if(L.status==='done'){L.status='running';L.endedAt=null;L.endedManually=false;}ui.sheet=null;toast('استُعيدت المباراة');commit();};
A.playNow=d=>{const L=cur(),m=byId(L,d.id);if(!m||active(L))return;moveToNext(L,m);ui.sheet=null;toast('أصبحت المباراة التالية');commit();};
A.mv=d=>{
  const L=cur(),m=byId(L,d.id);if(!m||m.status!=='pending')return;
  const i=L.matches.indexOf(m),dir=Number(d.d);let j=i+dir;
  while(j>=0&&j<L.matches.length&&L.matches[j].status!=='pending')j+=dir;
  if(j<0||j>=L.matches.length)return;
  L.matches[i]=L.matches[j];L.matches[j]=m;commit();
};
A.pauseLeague=()=>{
  const L=cur();if(!L||L.status==='done')return;const m=active(L);
  if(m&&m.status==='live'){m.remaining=Math.max(0,m.endAt-now());m.endAt=null;m.status='paused';}
  if(L.phase&&L.phase.kind==='break'&&L.phase.endAt){L.phase.remaining=Math.max(0,L.phase.endAt-now());L.phase.endAt=null;}
  L.status='paused';toast('تم إيقاف الدوري مؤقتاً');commit();syncWake();
};
A.resumeLeague=()=>{
  const L=cur();if(!L)return;L.status='running';
  if(L.phase&&L.phase.kind==='break'&&!L.phase.endAt)L.phase.endAt=now()+Math.max(1000,L.phase.remaining||0);
  toast('استُؤنف الدوري');commit();syncWake();
};
A.endLeague=()=>needAdmin(()=>{const L=cur();confirmBox({title:'إنهاء الدوري الآن؟',text:totals(L).left?`ما زالت ${totals(L).left} مباراة لم تُلعب. سيُعرض الترتيب الحالي كترتيب نهائي، ويمكنك متابعة الدوري لاحقاً من الإدارة.`:'سيُغلق الدوري ويُعرض الترتيب النهائي.',yes:'إنهاء الدوري',danger:true,onYes:()=>finishLeague(L,totals(L).left>0)});});
A.reopenLeague=()=>{const L=cur();if(!L||!totals(L).left)return;L.status='running';L.endedAt=null;L.endedManually=false;L.phase={kind:'ready'};toast('عاد الدوري للعمل');commit();};
A.tb=d=>{const L=cur(),i=+d.i,j=i+Number(d.d);if(j<1||j>=L.tiebreak.length)return;const t=L.tiebreak;[t[i],t[j]]=[t[j],t[i]];commit();};
A.mAddPlayer=d=>{const L=cur(),p=part(L,d.pid),el=$('#mp-'+d.pid),nm=el?el.value.trim():'';if(!nm)return toast('اكتب اسم اللاعب.');if(p.players.some(x=>x.name===nm))return toast('هذا الاسم موجود.');p.players.push({id:uid(),name:nm});commit();};
A.delPlayer=d=>{const L=cur(),p=part(L,d.pid);const used=L.matches.some(m=>m.events.some(e=>(m.a===p.id&&e.side==='a'||m.b===p.id&&e.side==='b')&&(e.scorer===d.plid||e.assist===d.plid)));if(used)return toast('لا يمكن حذفه: له أهداف أو تمريرات مسجلة. احذفها من تفاصيل المباراة أولاً.');p.players=p.players.filter(x=>x.id!==d.plid);commit();};
A.mAddPart=()=>{const L=cur();if(started(L))return;const el=$('#mp-new'),nm=el?el.value.trim():'';if(!nm)return toast('اكتب اسم المشارك.');if(L.participants.some(p=>p.name===nm))return toast('الاسم مكرر.');L.participants.push({id:uid(),name:nm,players:L.type==='individual'?[{id:'self',name:nm}]:[]});buildSchedule(L,null);toast(`أُعيد إنشاء الجدول: ${L.matches.length} مباراة`);commit();};
A.mDelPart=d=>{const L=cur();if(started(L))return;if(L.participants.length<=2)return toast('يحتاج الدوري مشاركَين على الأقل.');confirmBox({title:'حذف المشارك؟',text:'سيُعاد إنشاء جدول المباريات.',yes:'حذف',danger:true,onYes:()=>{L.participants=L.participants.filter(p=>p.id!==d.pid);buildSchedule(L,null);commit();}});};
A.theme=d=>{DB.prefs.theme=d.k;commit();};
A.accent=d=>{DB.prefs.accent=d.k;commit();};
A.testSound=()=>{unlockAudio();const s=DB.prefs.sound;DB.prefs.sound=true;alarm('end');DB.prefs.sound=s;};
A.savePin=()=>{const L=cur(),v=(($('#s-pin')||{}).value||'').trim();if(v.length<4)return toast('الرمز يجب أن يكون 4 خانات على الأقل.');const doit=()=>{L.pin=v;ui.adminUntil=now()+15*60000;toast('تم حفظ رمز المسؤول');commit();};L.pin?needAdmin(doit):doit();};
A.clearPin=()=>needAdmin(()=>{const L=cur();L.pin='';toast('أُزيل رمز المسؤول');commit();});
A.openLeague=d=>{DB.currentId=d.id;go('home');};
A.delLeague=d=>{const L=DB.leagues.find(x=>x.id===d.id);if(!L)return;confirmBox({title:'حذف الدوري نهائياً؟',text:`سيُحذف «${L.name}» بكل نتائجه وإحصائياته من هذا الجهاز.`,yes:'حذف نهائي',danger:true,onYes:()=>{DB.leagues=DB.leagues.filter(x=>x.id!==d.id);if(DB.currentId===d.id)DB.currentId=DB.leagues[0]?DB.leagues[0].id:null;commit();}});};
A.exportCsv=()=>{ui.sheet={type:'csv'};renderSheet();};
A.copyCsv=()=>{const ta=$('#csv-out');const txt=ta?ta.value:'';const fallback=()=>{try{ta.focus();ta.select();ta.setSelectionRange(0,txt.length);document.execCommand&&document.execCommand('copy');toast('حدّدنا النص؛ انسخه من القائمة إن لم يُنسخ تلقائياً');}catch(e){}};try{if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(()=>toast('تم النسخ'),fallback);else fallback();}catch(e){fallback();}};
A.dlCsv=()=>{try{const L=cur(),blob=new Blob(['﻿'+csv(L)],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(L.name||'league').replace(/[\\/:*?"<>|]/g,'_')+'.csv';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}catch(e){toast('تعذّر التنزيل، استخدم النسخ.');}};
A.printPage=()=>{ui.sheet=null;renderSheet();go('standings');setTimeout(()=>{try{window.print();}catch(e){}},150);};

function csv(L){
  const q=v=>{v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  const rows=[[L.name],[FORMAT_LABEL[L.format]+' · '+STATE_LABEL[leagueState(L)]],[]];
  if(L.format!=='ko'){
    rows.push(['الترتيب']);rows.push(['المركز','المشارك','لعب','فاز','تعادل','خسر','له','عليه','الفارق','النقاط']);
    E.table(L).forEach(r=>rows.push([r.rank+(r.tied?'=':''),r.name,r.P,r.W,r.D,r.L,r.GF,r.GA,r.GD,r.Pts]));rows.push([]);
  } else {rows.push(['الترتيب']);E.koRanking(L).forEach(r=>rows.push([r.rank,pname(L,r.id),r.label]));rows.push([]);}
  rows.push(['النتائج']);rows.push(['رقم','الجولة','المشارك الأول','أهداف الأول','أهداف الثاني','المشارك الثاني','الحالة']);
  const SL={pending:'لم تبدأ',live:'جارية',paused:'متوقفة',scoring:'بانتظار النتيجة',done:'انتهت',cancelled:'ملغاة'};
  L.matches.forEach((m,i)=>rows.push([i+1,roundLabel(L,m),pname(L,m.a),m.status==='done'?m.sa:'',m.status==='done'?m.sb:'',pname(L,m.b),SL[m.status]+(m.status==='done'&&L.format==='ko'&&m.sa===m.sb?' (ترجيح: '+pname(L,m.pk)+')':'')]));
  const S=E.playerStats(L);
  if(S.attr>0){rows.push([]);rows.push(['إحصائيات اللاعبين']);rows.push(['اللاعب','المشارك','أهداف','تمريرات حاسمة','المجموع']);S.players.filter(r=>r.G+r.A>0).sort((a,b)=>(b.G+b.A)-(a.G+a.A)).forEach(r=>rows.push([r.name,r.team,r.G,r.A,r.G+r.A]));rows.push(['أهداف منسوبة',S.attr+' من '+S.total]);}
  return rows.map(r=>r.map(q).join(',')).join('\n');
}

/* ---------------- field handling ---------------- */
function softRender(){
  clearTimeout(softRender._t);
  softRender._t=setTimeout(()=>{
    const a=document.activeElement,id=a&&a.id;let s0=null,s1=null;
    try{s0=a.selectionStart;s1=a.selectionEnd;}catch(x){}
    render();
    if(id){const el=document.getElementById(id);if(el&&el!==document.activeElement){try{el.focus({preventScroll:true});if(s0!=null)el.setSelectionRange(s0,s1);}catch(x){}}}
  },0);
}
function refreshStarter(){
  const sel=$('#d-start'),D=DB.draft;if(!sel||!D)return;
  sel.innerHTML='<option value="">تلقائي</option>'+D.names.map((nm,i)=>nm.trim()?`<option value="${i}" ${String(D.starter)===String(i)?'selected':''}>${esc(nm)}</option>`:'').join('');
}
function onField(el,isChange){
  const k=el.dataset.in,val=el.type==='checkbox'?el.checked:el.value,L=cur();
  if(k.indexOf('d.')===0){const f=k.slice(2);DB.draft[f]=val;DB.draft.err='';save();if(isChange&&(el.dataset.re||f==='starter'))softRender();return;}
  if(k==='dname'){DB.draft.names[+el.dataset.i]=val;save();if(isChange)refreshStarter();return;}
  if(k==='dcount'){if(!isChange)return;const n=Math.max(2,Math.min(64,parseInt(val,10)||2)),D=DB.draft;while(D.names.length<n)D.names.push('');if(D.names.length>n)D.names.length=n;save();softRender();return;}
  if(k==='statsPlayer'){ui.statsPlayer=val;softRender();return;}
  if(k.indexOf('pref.')===0){DB.prefs[k.slice(5)]=val;save();return;}
  if(!L) return;
  if(k.indexOf('set.')===0){
    const f=k.slice(4);
    if(f==='name'){if(val.trim()){L.name=val.trim();save();if(isChange)softRender();}return;}
    if(f==='adjust'||f==='selfAssist'||f==='goalPrompt'){L[f]=!!val;save();softRender();return;}
    if(!isChange)return;
    const num=Number(val);
    if(f==='matchMin'){if(num>=0.5&&num<=120){L.matchMin=num;toast('ستُطبَّق المدة الجديدة على المباريات القادمة');}else toast('أدخل مدة بين 0.5 و120 دقيقة');save();softRender();return;}
    if(f==='breakMin'){if(num>=0&&num<=60){L.breakMin=num;toast('ستُطبَّق على الاستراحات القادمة');}else toast('أدخل مدة بين 0 و60 دقيقة');save();softRender();return;}
    if(f==='win'||f==='draw'||f==='loss'){const v=parseInt(val,10),P=Object.assign({},L.points,{[f]:v});if(!isNaN(v)&&P.win>P.draw&&P.draw>=P.loss){L.points=P;toast('أُعيد احتساب الترتيب بالنقاط الجديدة');}else toast('الفوز أكبر من التعادل، والتعادل لا يقل عن الخسارة');save();softRender();return;}
  }
  if(k==='pname'){const p=part(L,el.dataset.pid),v=val.trim();if(!v)return;if(L.participants.some(x=>x!==p&&x.name===v)){if(isChange)toast('الاسم مكرر');return;}p.name=v;const self=p.players.find(x=>x.id==='self');if(self)self.name=v;save();if(isChange)softRender();return;}
  if(k==='plname'){const p=part(L,el.dataset.pid),x=p&&p.players.find(y=>y.id===el.dataset.plid);if(x&&val.trim()){x.name=val.trim();save();}return;}
  if(k==='evScorer'||k==='evAssist'){
    const m=tgt(el.dataset.t);if(!m)return;const e=m.events.find(x=>x.id===el.dataset.id);if(!e)return;
    delete e.auto;
    if(k==='evScorer'){e.scorer=val;if(e.assist===val&&!L.selfAssist)e.assist='';}else e.assist=val;
    if(el.dataset.t==='edit')renderSheet();else save();softRender();
  }
}

/* ---------------- confetti ---------------- */
function confetti(){
  try{if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;}catch(e){}
  const c=document.createElement('canvas');c.id='confetti';document.body.appendChild(c);
  const ctx=c.getContext&&c.getContext('2d');if(!ctx){c.remove();return;}
  const W=c.width=innerWidth*devicePixelRatio,H=c.height=innerHeight*devicePixelRatio;
  const cols=['#F2C443','#FFFFFF','#2EC06B','#0E6B37','#FF7A62'];
  const ps=Array.from({length:170},()=>({x:Math.random()*W,y:-Math.random()*H*0.6,vx:(Math.random()-.5)*3*devicePixelRatio,vy:(2+Math.random()*4)*devicePixelRatio,s:(5+Math.random()*7)*devicePixelRatio,r:Math.random()*6,vr:(Math.random()-.5)*.25,c:cols[Math.floor(Math.random()*cols.length)]}));
  const t0=performance.now();
  (function f(t){ctx.clearRect(0,0,W,H);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore();});if(t-t0<4500)requestAnimationFrame(f);else c.remove();})(t0);
}

/* ---------------- wiring ---------------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b||b.disabled) return;
  const fn=A[b.dataset.act]; if(!fn) return;
  if(b.dataset.act!=='ovClose') e.stopPropagation();
  unlockAudio();
  fn(b.dataset,b,e);
});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset&&el.dataset.in&&el.tagName!=='SELECT'&&el.type!=='checkbox')onField(el,false);});
document.addEventListener('change',e=>{const el=e.target;if(el.id==='imp-file'){readFileInto(el,'imp-text',false);return;}if(el.id==='nm-file'){readFileInto(el,'nm-text',true);return;}if(el.dataset&&el.dataset.in)onField(el,true);});
document.addEventListener('keydown',e=>{
  const el=e.target;
  if(e.key==='Enter'&&el.dataset&&el.dataset.in==='dname'){e.preventDefault();const i=+el.dataset.i,nx=$('#dn-'+(i+1));if(nx)nx.focus();else A.dAdd();}
  if(e.key==='Enter'&&el.id==='pin-in'){e.preventDefault();A.pinOk();}
  if(e.key==='Enter'&&(el.id==='g-new-scorer'||el.id==='g-new-assist')){e.preventDefault();A.gNew({f:el.id.slice(6)});}
  if(e.key==='Escape'){if(ui.goal)A.gClose();else if(ui.sheet)A.closeSheet();}
});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){tick();syncWake();}});
window.addEventListener('pageshow',()=>tick());
window.addEventListener('storage',e=>{if(e.key===KEY){DB=load();render();}});

render();
tick();
setInterval(tick,250);
window.__dawri={E,get DB(){return DB;},A,tick};
})();
