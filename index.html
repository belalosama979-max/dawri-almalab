<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>دوري الملعب</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="إدارة دوريات كرة القدم بين الطلاب على ملعب واحد.">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0E6B37">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="دوري الملعب">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: one-column field-side console; a chalk-lined "pitch" card carries the clock, everything else sits on plain surfaces; fixed bottom tab bar for thumbs. */
:root{
  --bg:#F2F5F1; --surface:#FFFFFF; --surface-2:#E6ECE5; --ink:#0C1810; --muted:#56685C; --line:#D3DCD3;
  --pitch:#0E6B37; --pitch-deep:#09482A; --chalk:#F4FAF2; --chalk-warn:#FFD65A;
  --accent:#0F8A45; --accent-ink:#FFFFFF;
  --live:#D9412A; --live-soft:#FBE3DE; --warn:#A86F00; --warn-soft:#FFF1CF; --ok:#0F8A45; --ok-soft:#DDF2E3; --gold:#B8860B; --gold-soft:#FBF0D2;
  --shade:rgba(6,16,10,.55);
  --font-display:'Changa','IBM Plex Sans Arabic',system-ui,'Segoe UI',Tahoma,sans-serif;
  --font-body:'IBM Plex Sans Arabic',system-ui,'Segoe UI',Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#09110C; --surface:#111B14; --surface-2:#18251C; --ink:#E8F2EA; --muted:#93A799; --line:#233328;
  --pitch:#0D5A2F; --pitch-deep:#083B1F; --chalk:#F0F8EE; --accent:#2EC06B; --accent-ink:#03130A;
  --live:#FF6B52; --live-soft:#3A1712; --warn:#F0B53A; --warn-soft:#33270B; --ok:#2EC06B; --ok-soft:#0F2C1A; --gold:#E9B93C; --gold-soft:#2E2610;
  --shade:rgba(0,0,0,.65); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#09110C; --surface:#111B14; --surface-2:#18251C; --ink:#E8F2EA; --muted:#93A799; --line:#233328;
  --pitch:#0D5A2F; --pitch-deep:#083B1F; --chalk:#F0F8EE; --accent:#2EC06B; --accent-ink:#03130A;
  --live:#FF6B52; --live-soft:#3A1712; --warn:#F0B53A; --warn-soft:#33270B; --ok:#2EC06B; --ok-soft:#0F2C1A; --gold:#E9B93C; --gold-soft:#2E2610;
  --shade:rgba(0,0,0,.65); color-scheme:dark }
:root[data-accent="blue"]{--pitch:#1B4C8C; --pitch-deep:#113463; --accent:#2D73D2; --accent-ink:#FFFFFF}
:root[data-accent="orange"]{--pitch:#A9481A; --pitch-deep:#78310F; --accent:#D2611E; --accent-ink:#FFFFFF}
:root[data-accent="black"]{--pitch:#171C19; --pitch-deep:#0B0E0C; --accent:#1F8F4E; --accent-ink:#FFFFFF}

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--font-body);font-size:16px;line-height:1.55;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.42}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{margin:0;font-family:var(--font-display);line-height:1.25;text-wrap:balance}
p{margin:0}
.ic{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
.ltr{direction:ltr;unicode-bidi:isolate}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1000px;margin:0 auto;display:flex;align-items:center;gap:8px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:4px 0;min-width:0;flex:1;text-align:right}
.logo{width:38px;height:38px;border-radius:11px;background:var(--pitch);color:var(--chalk);display:grid;place-items:center;flex:none}
.brand-t{display:grid;min-width:0}
.brand-t b{font-family:var(--font-display);font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-t small{font-size:12px;color:var(--muted)}
.top-act{display:flex;gap:4px}
.icon-btn{width:44px;height:44px;border-radius:12px;border:1px solid transparent;background:none;display:grid;place-items:center;color:var(--ink)}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn[aria-current="page"]{background:var(--surface-2);color:var(--accent)}

/* main */
.main{max-width:1000px;margin:0 auto;display:grid;gap:16px;padding-block:16px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.main>*{min-width:0}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-head h2{font-size:24px;font-weight:700}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--muted)}
.disp{font-family:var(--font-display)}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
.nav-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 10px;background:none;border:0;font-size:12px;font-weight:600;color:var(--muted);min-height:62px}
.nav button[aria-current="page"]{color:var(--accent)}
.nav button[aria-current="page"]::before{content:"";position:absolute;top:0;inset-inline:28%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.nav .dot{position:absolute;top:9px;inset-inline-start:calc(50% + 8px);width:9px;height:9px;border-radius:50%;background:var(--live);animation:pulse 1.2s infinite}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:14px}
.card h3{font-size:18px;font-weight:700}
.grid2{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row>.grow{flex:1 1 160px}
.stack{display:grid;gap:10px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 18px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;text-decoration:none;transition:transform .12s ease,background .15s}
.btn:active:not(:disabled){transform:scale(.97)}
.btn-primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn-ink{background:var(--ink);color:var(--bg);border-color:transparent}
.btn-danger{color:var(--live);border-color:var(--live)}
.btn-chalk{background:var(--chalk);color:var(--pitch-deep);border-color:transparent}
.btn-onpitch{background:rgba(255,255,255,.12);color:var(--chalk);border-color:rgba(255,255,255,.28)}
.btn-xl{min-height:68px;font-size:clamp(18px,5vw,22px);white-space:nowrap;font-family:var(--font-display);font-weight:700;width:100%;border-radius:18px}
.btn-wide{width:100%}
.btn-sm{min-height:40px;padding:0 12px;font-size:14px;border-radius:11px}

/* pitch card */
.pitch{position:relative;overflow:hidden;isolation:isolate;background:var(--pitch);color:var(--chalk);border-radius:22px;padding:18px}
.pitch .lines{position:absolute;inset:0;width:100%;height:100%;z-index:-1;opacity:.2;pointer-events:none}
.pitch-in{display:grid;gap:14px}
.pitch .eyebrow{color:var(--chalk);opacity:.8}
.pitch-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.state-chip{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:99px;background:rgba(0,0,0,.22);font-weight:700;font-size:14px}
.state-chip i{width:9px;height:9px;border-radius:50%;background:var(--chalk)}
.state-chip.live i{background:#FF7A62;animation:pulse 1.1s infinite}
.clock{font-family:var(--font-display);font-weight:700;font-size:clamp(84px,27vw,210px);line-height:1;letter-spacing:.01em;font-variant-numeric:tabular-nums;text-align:center;direction:ltr}
.clock.sm{font-size:clamp(54px,16vw,96px)}
.clock.low{color:var(--chalk-warn)}
.clock.zero{color:#FF9C88;animation:blink 1s steps(2,start) infinite}
.bar{height:8px;background:rgba(255,255,255,.2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--chalk);border-radius:99px;transition:width .3s linear}
.vs-line{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;text-align:center}
.vs-line b{font-family:var(--font-display);font-size:clamp(20px,6vw,32px);font-weight:700;overflow-wrap:anywhere;min-width:0}
.vs-line span{font-family:var(--font-display);font-size:18px;opacity:.75}
.sc,.msc{unicode-bidi:isolate}
.vs-line .sc{font-size:clamp(28px,8vw,44px);opacity:1;font-weight:800;direction:ltr}

/* scoreboard */
.board{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px 10px}
.side{display:grid;gap:10px;justify-items:center;text-align:center;min-width:0}
.side-name{font-family:var(--font-display);font-weight:700;font-size:clamp(19px,5.5vw,30px);overflow-wrap:anywhere;line-height:1.2}
.score-big{font-family:var(--font-display);font-weight:800;font-size:clamp(66px,20vw,130px);line-height:1;font-variant-numeric:tabular-nums}
.board .colon{font-family:var(--font-display);font-size:clamp(40px,12vw,80px);font-weight:700;color:var(--muted);align-self:center;padding-top:28px}
.stepper{display:flex;gap:10px}
.stepper button{width:62px;height:62px;border-radius:16px;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center}
.stepper button.plus{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.stepper .ic{width:28px;height:28px;stroke-width:2.6}
.pk{display:grid;gap:8px;padding:12px;border-radius:14px;background:var(--warn-soft);color:var(--ink)}
.pk .row button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.ctrl{display:grid;gap:10px}
.ctrl-row{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr))}
.adj{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.adj .btn{min-height:46px;padding:0 6px;font-size:15px}
.errs{display:grid;gap:6px;padding:12px 14px;border-radius:14px;background:var(--live-soft);color:var(--ink);font-size:14px}
.errs b{color:var(--live)}
.note{padding:12px 14px;border-radius:14px;background:var(--surface-2);font-size:14px;color:var(--ink)}
.note.warn{background:var(--warn-soft)}
.note.ok{background:var(--ok-soft)}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:14px 16px;border-radius:16px;background:var(--warn-soft);border:1px solid var(--warn)}
.banner.install{background:var(--ok-soft);border-color:var(--accent)}
.steps-list{margin:0;padding-inline-start:22px;display:grid;gap:10px}
.banner b{font-family:var(--font-display);font-size:18px}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:grid;gap:2px}
.kpi b{font-family:var(--font-display);font-size:30px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:var(--muted)}
@media (max-width:520px){.kpis{grid-template-columns:repeat(2,1fr)}}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px}
.quick .btn{justify-content:flex-start;min-height:56px}

/* match list */
.mlist{display:grid;gap:8px}
.mrow{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px}
.mrow.is-current{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.mrow.is-next{border-color:var(--accent);border-style:dashed}
.mrow.is-cancelled .mt b{text-decoration:line-through;opacity:.6}
.mmain{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;background:none;border:0;padding:8px;text-align:right;min-width:0;border-radius:12px}
.mmain:hover{background:var(--surface-2)}
.mno{width:36px;height:36px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-variant-numeric:tabular-nums}
.is-current .mno{background:var(--accent);color:var(--accent-ink)}
.mbody{display:grid;gap:4px;min-width:0}
.mt{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.mt b{font-weight:600;overflow-wrap:anywhere;min-width:0}
.mt b:last-child{text-align:left}
.mt .msc{font-family:var(--font-display);font-weight:700;font-variant-numeric:tabular-nums;direction:ltr;min-width:52px;text-align:center}
.mt .vs{color:var(--muted);font-size:13px}
.mmeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--ink)}
.chip.live{background:var(--live-soft);color:var(--live)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.gold{background:var(--gold-soft);color:var(--gold)}
.arrows{display:flex;flex-direction:column;gap:2px}
.arrows .icon-btn{width:40px;height:36px}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:11px 9px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--surface-2)}
td.name{text-align:right;font-weight:600;white-space:normal;min-width:110px}
td.pts{font-family:var(--font-display);font-weight:800;font-size:19px}
tr.first td{background:var(--gold-soft)}
.rank{font-family:var(--font-display);font-weight:700}

/* forms */
.field{display:grid;gap:6px}
.field>label,.lbl{font-size:14px;font-weight:600}
.hint{font-size:13px;color:var(--muted)}
input[type=file]{width:100%;font-size:14px;padding:10px;border:1px dashed var(--line);border-radius:12px;background:var(--surface)}
input[type=text],input[type=number],input[type=password],select,textarea{width:100%;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0 12px}
textarea{padding:10px 12px;min-height:160px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;direction:ltr;text-align:left}
input[type=number]{font-variant-numeric:tabular-nums}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1 1 auto;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 14px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chk{display:flex;gap:10px;align-items:flex-start;padding:10px 0}
.chk input{width:22px;height:22px;margin-top:2px;accent-color:var(--accent);flex:none}
.plist{display:grid;gap:8px}
.prow{display:grid;grid-template-columns:34px 1fr 44px;gap:8px;align-items:center}
.pno{font-family:var(--font-display);font-weight:700;color:var(--muted);text-align:center}
.pts3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.custom{display:flex;align-items:center;gap:8px}
.custom input{max-width:120px}
.preview{display:flex;flex-wrap:wrap;gap:8px 16px;padding:14px;border-radius:14px;background:var(--surface-2)}
.preview b{font-family:var(--font-display);font-size:20px}

/* stats entry */
.stats-box{display:grid;gap:12px;border:1px dashed var(--line);border-radius:16px;padding:12px}
.st-side{display:grid;gap:8px}
.st-side h4{font-size:16px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.goal-ov{z-index:55}
.gl-title{font-size:17px;display:flex;align-items:center;gap:8px}
.goal{display:grid;grid-template-columns:34px 1fr 44px;gap:6px;align-items:center;padding:4px 4px 4px 0;border-radius:12px;background:var(--surface-2);border:0;width:100%;text-align:right;color:var(--ink)}
.goal-unk{grid-template-columns:34px 1fr;border:1px dashed var(--warn);background:var(--warn-soft);min-height:52px}
.gno{display:grid;place-items:center;color:var(--accent)}
.goal-main{display:grid;gap:1px;background:none;border:0;padding:6px 4px;text-align:right;min-width:0;color:var(--ink)}
.goal-main b{font-weight:700;overflow-wrap:anywhere}
.goal-main small{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:4px}
.goal-main small .ic{width:15px;height:15px}
.seg.pick button{flex:0 1 auto;min-height:48px}
.seg.pick button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.ev{display:grid;grid-template-columns:30px 1fr 44px;gap:6px 8px;align-items:center;padding:8px;border-radius:12px;background:var(--surface-2)}
.ev .ic{color:var(--muted)}
.ev select{min-height:44px}

/* lists in stats */
.lb{display:grid;gap:6px}
.lb-row{display:grid;grid-template-columns:32px 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:12px;background:var(--surface-2)}
.lb-row b{font-family:var(--font-display);font-size:20px;font-variant-numeric:tabular-nums}
.lb-row .who{display:grid;min-width:0}
.lb-row .who span{overflow-wrap:anywhere}
.lb-row .who small{font-size:12px;color:var(--muted)}

/* bracket */
.bracket{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(190px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px}
.bcol{display:grid;gap:8px;align-content:space-around}
.bcol h4{font-size:15px;color:var(--muted)}
.bm{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.bm div{display:flex;justify-content:space-between;gap:8px;padding:8px 10px}
.bm div+div{border-top:1px solid var(--line)}
.bm .w{font-weight:700;background:var(--ok-soft)}
.bm .tbd{color:var(--muted)}

/* sheet */
.sheet-ov{position:fixed;inset:0;z-index:50;background:var(--shade);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s ease}
.sheet{width:100%;max-width:640px;max-height:92vh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;display:grid;gap:14px;padding-block:18px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));animation:rise .2s ease}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet-head h3{font-size:20px}
@media (min-width:720px){.sheet-ov{align-items:center}.sheet{border-radius:22px}}

/* flash */
.flash{position:fixed;inset:0;z-index:60;display:grid;place-items:center;text-align:center;padding:24px;color:#FFFFFF;background:#C9331D;animation:flashbg 1.1s infinite}
.flash.ready{background:#0B6A35;animation:none}
.flash-in{display:grid;gap:18px;justify-items:center;max-width:520px}
.flash h2{font-size:clamp(40px,12vw,78px);font-weight:800}
.flash p{font-size:20px}
.flash .btn{background:#FFFFFF;color:#111111;border-color:transparent;min-width:260px}

/* toast */
.toast{position:fixed;z-index:70;left:50%;transform:translateX(-50%);top:calc(72px + env(safe-area-inset-top,0px));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:600;max-width:calc(100% - 32px);text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:rise .2s ease}

/* champion */
.champ{position:relative;overflow:hidden;isolation:isolate;text-align:center;border-radius:24px;padding:28px 18px;background:var(--pitch-deep);color:var(--chalk);display:grid;gap:12px;justify-items:center}
.champ .lines{position:absolute;inset:0;width:100%;height:100%;z-index:-1;opacity:.16}
.champ .trophy{width:120px;height:120px;color:#F2C443;filter:drop-shadow(0 8px 18px rgba(0,0,0,.35));animation:lift 2.6s ease-in-out infinite}
.champ h1{font-size:clamp(40px,12vw,80px);font-weight:800;line-height:1.1;overflow-wrap:anywhere}
.champ .eyebrow{color:#F2C443;font-size:16px;opacity:1}
.podium{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:10px;width:100%;max-width:560px}
.podium div{background:rgba(255,255,255,.1);border-radius:14px;padding:12px;display:grid;gap:2px}
.podium small{opacity:.8}
.podium b{font-family:var(--font-display);font-size:22px;overflow-wrap:anywhere}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:40;width:100%;height:100%}

/* hero */
.hero{position:relative;overflow:hidden;isolation:isolate;background:var(--pitch);color:var(--chalk);border-radius:24px;padding:28px 20px;display:grid;gap:14px}
.hero .lines{position:absolute;inset:0;width:100%;height:100%;z-index:-1;opacity:.2}
.hero h1{font-size:clamp(30px,8vw,48px);font-weight:800}
.hero p{max-width:46ch;opacity:.9}
.steps{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.steps div{background:rgba(255,255,255,.1);border-radius:14px;padding:12px}
.steps b{font-family:var(--font-display);display:block}

.match-grid{display:grid;gap:14px}
@media (min-width:900px){
  .match-grid{grid-template-columns:1.15fr 1fr;align-items:start}
  .match-grid .full{grid-column:1/-1}
}
.hist{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.hist .open{display:grid;gap:2px;background:none;border:0;text-align:right;padding:4px}

@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes blink{to{visibility:hidden}}
@keyframes flashbg{0%,100%{background:#C9331D}50%{background:#8E1F10}}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(14px);opacity:0}}
@keyframes lift{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.toast{animation-name:rise}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

(function(){

ROOT.lang='ar'; ROOT.dir='rtl';
const HOST_THEME=ROOT.getAttribute('data-theme');

/* ---------------- utilities ---------------- */

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const fmt=ms=>{ms=Math.max(0,ms||0);const s=Math.ceil(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');};
const $=(s,r)=>(r||document).querySelector(s);
const KEY='dawri-almalab-v1';
const IS_TOP=(()=>{try{return window.self===window.top;}catch(e){return false;}})();

const ICONS={
 home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
 timer:'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/>',

 history:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/>',

 up:'<path d="M6 15l6-6 6 6"/>', down:'<path d="M6 9l6 6 6-6"/>',
 play:'<path d="M7 4v16l13-8z" fill="currentColor"/>', pause:'<path d="M7 4h3v16H7zM14 4h3v16h-3z" fill="currentColor"/>',

 ball:'<circle cx="12" cy="12" r="9"/><path d="M12 7.5l4 2.9-1.5 4.6h-5L8 10.4z"/><path d="M12 7.5V3.2M16 10.4l4.2-1.3M14.5 15l2.6 3.6M9.5 15l-2.6 3.6M8 10.4L3.8 9.1"/>',
 shuffle:'<path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/>',
 copy:'<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/>',

 skip:'<path d="M5 4l10 8-10 8zM19 5v14"/>',

 edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',
 lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
 replay:'<path d="M4 12a8 8 0 1 0 2.3-5.7L4 8.5"/><path d="M4 4v4.5h4.5"/>',
 download:'<path d="M12 4v11M7 10l5 5 5-5M4 20h16"/>',
 upload:'<path d="M12 16V5M7 10l5-5 5 5M4 20h16"/>',
 print:'<path d="M7 9V3h10v6M7 17H4v-7h16v7h-3M7 14h10v7H7z"/>',
 sound:'<path d="M4 9h4l5-4v14l-5-4H4zM17 9a4 4 0 0 1 0 6M19.5 6.5a8 8 0 0 1 0 11"/>',
 users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5a6.5 6.5 0 0 1 3.5 5.5"/>'
};
const ic=n=>`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]||''}</svg>`;
const PITCH_LINES=`<svg class="lines" viewBox="0 0 400 240" preserveAspectRatio="none" aria-hidden="true"><g fill="none" stroke="#FFFFFF" stroke-width="2"><rect x="10" y="10" width="380" height="220"/><line x1="200" y1="10" x2="200" y2="230"/><circle cx="200" cy="120" r="38"/><circle cx="200" cy="120" r="2.5" fill="#FFFFFF"/><rect x="10" y="62" width="58" height="116"/><rect x="332" y="62" width="58" height="116"/><rect x="10" y="94" width="22" height="52"/><rect x="368" y="94" width="22" height="52"/></g></svg>`;
const TROPHY=`<svg class="trophy" viewBox="0 0 64 64" aria-hidden="true"><path fill="currentColor" d="M18 6h28v14a14 14 0 0 1-28 0z"/><path fill="none" stroke="currentColor" stroke-width="4" d="M18 11H9a9 9 0 0 0 10 12M46 11h9a9 9 0 0 1-10 12"/><rect x="29" y="33" width="6" height="11" fill="currentColor"/><path fill="currentColor" d="M21 44h22l3 8H18z"/><rect x="15" y="52" width="34" height="6" rx="2" fill="currentColor"/></svg>`;

const ORD=['الأولى','الثانية','الثالثة','الرابعة','الخامسة','السادسة','السابعة','الثامنة','التاسعة','العاشرة'];
/* scores are printed inside an LTR run, so the right-hand number belongs to the right-hand (first) side */
const sc2=(a,b)=>b+' – '+a;
const matchLabel=i=>'المباراة '+(i<10?ORD[i]:(i+1));
const TB_LABEL={pts:'مجموع النقاط',gd:'فارق الأهداف',gf:'الأهداف المسجلة',h2h:'المواجهة المباشرة',w:'عدد الانتصارات'};
const STATE_LABEL={idle:'لم يبدأ',running:'جارٍ',paused:'متوقف مؤقتاً',done:'مكتمل'};
const FORMAT_LABEL={single:'دوري من دور واحد',double:'دوري من دورين',ko:'خروج المغلوب'};

/* ---------------- storage ---------------- */
let storageOK=true;
function load(){
  let d=null;
  try{const raw=localStorage.getItem(KEY); if(raw) d=JSON.parse(raw);}catch(e){storageOK=false;}
  if(!d||d.v!==1) d={v:1,leagues:[],currentId:null,draft:null,view:'home',prefs:{}};
  d.prefs=Object.assign({theme:'system',accent:'green',sound:true,vibrate:true},d.prefs||{});
  if(!Array.isArray(d.leagues)) d.leagues=[];
  return d;
}
let DB=load();
function save(){ try{localStorage.setItem(KEY,JSON.stringify(DB)); storageOK=true;}catch(e){storageOK=false;} }
const ui={view:(location.hash==='#match'?'match':(DB.view||'home')),sheet:null,edit:null,statsOpen:{},statsPlayer:'',adminUntil:0,flash:null,toast:null,celebrate:false};

/* ---------------- engine (pure logic, no DOM) ---------------- */
const E={};
E.roundRobin=(ids,legs)=>{
  const arr=ids.slice(); if(arr.length%2) arr.push(null);
  const n=arr.length,R=n-1,out=[],byes={}; let rot=arr.slice();
  for(let r=0;r<R;r++){
    for(let i=0;i<n/2;i++){
      const x=rot[i],y=rot[n-1-i];
      if(x===null||y===null){byes[r+1]=x===null?y:x;continue;}
      const pair=((r+i)%2===0)?[x,y]:[y,x];
      out.push({a:pair[0],b:pair[1],round:r+1,leg:1});
    }
    rot=[rot[0],rot[n-1]].concat(rot.slice(1,n-1));
  }
  if(legs===2){
    out.slice().forEach(m=>out.push({a:m.b,b:m.a,round:m.round+R,leg:2}));
    Object.keys(byes).forEach(k=>{byes[+k+R]=byes[k];});
  }
  return {matches:out,byes};
};
/* order matches for a single pitch: nobody plays twice in a row when avoidable, rounds stay roughly in order */
E.arrange=(ms,starter,before)=>{
  if(ms.length<2) return ms.slice();
  const overlap=(p,c)=>p&&(p.a===c.a||p.a===c.b||p.b===c.a||p.b===c.b);
  let best=null,bestScore=Infinity;
  for(let t=0;t<500;t++){
    const pool=ms.slice(),out=[];
    while(pool.length){
      const minR=Math.min.apply(null,pool.map(m=>m.round));
      const prev=out[out.length-1]||before||null;
      const win=t===0?0:1;
      let cand=pool.filter(m=>m.round<=minR+win);
      if(!out.length&&starter){
        const c=pool.filter(m=>(m.a===starter||m.b===starter));
        const c1=c.filter(m=>m.round<=minR+win);
        if(c1.length) cand=c1; else if(c.length) cand=c;
      }
      let free=cand.filter(m=>!overlap(prev,m));
      if(!free.length) free=pool.filter(m=>!overlap(prev,m)&&m.round<=minR+2);
      const from=free.length?free:cand;
      const lr=Math.min.apply(null,from.map(m=>m.round));
      const lowest=t<2?from.filter(m=>m.round===lr):from;
      const pick=t===0?lowest[0]:lowest[Math.floor(Math.random()*lowest.length)];
      out.push(pick); pool.splice(pool.indexOf(pick),1);
    }
    let conf=(before&&out[0]&&overlap(before,out[0]))?1:0,dis=0;
    for(let i=1;i<out.length;i++){ if(overlap(out[i-1],out[i])) conf++; if(out[i].round<out[i-1].round) dis++; }
    const sc=conf*1000+dis;
    if(sc<bestScore){best=out;bestScore=sc;if(sc===0)break;}
  }
  return best;
};
E.seedOrder=size=>{let o=[1];while(o.length<size){const n=o.length*2;o=o.reduce((a,s)=>a.concat([s,n+1-s]),[]);}return o;};
E.winner=m=>m.sa>m.sb?m.a:m.sb>m.sa?m.b:m.pk;
E.loser=m=>{const w=E.winner(m);return w===m.a?m.b:m.a;};
E.koRounds=L=>{
  const R=Math.round(Math.log2(L.ko.size)); const rounds=[L.ko.slots.slice()];
  for(let r=0;r<R;r++){
    const c=rounds[r],nx=[];
    for(let k=0;k<c.length/2;k++){
      const a=c[2*k],b=c[2*k+1]; let w;
      if(a===undefined||b===undefined) w=undefined;
      else if(a===null&&b===null) w=null;
      else if(a===null) w=b; else if(b===null) w=a;
      else{ const m=L.matches.find(x=>x.ko&&x.ko.r===r&&x.ko.k===k); w=(m&&m.status==='done'&&m.a===a&&m.b===b)?E.winner(m):undefined; }
      nx.push(w);
    }
    rounds.push(nx);
  }
  return rounds;
};
E.koSync=L=>{
  for(let pass=0;pass<8;pass++){
    const rounds=E.koRounds(L),R=rounds.length-1; let changed=false;
    for(let r=0;r<R;r++){
      for(let k=0;k<rounds[r].length/2;k++){
        const a=rounds[r][2*k],b=rounds[r][2*k+1];
        const m=L.matches.find(x=>x.ko&&x.ko.r===r&&x.ko.k===k);
        const ready=typeof a==='string'&&typeof b==='string';
        if(ready&&!m){L.matches.push(newMatch(a,b,{ko:{r,k},round:r+1}));changed=true;}
        else if(m&&m.status==='pending'){
          if(!ready){L.matches.splice(L.matches.indexOf(m),1);changed=true;}
          else if(m.a!==a||m.b!==b){m.a=a;m.b=b;changed=true;}
        }
      }
    }
    if(!changed) break;
  }
};
E.isComplete=L=>{
  if(L.format==='ko'){const r=E.koRounds(L);return typeof r[r.length-1][0]==='string';}
  const v=L.matches.filter(m=>m.status!=='cancelled');
  return v.length>0&&v.every(m=>m.status==='done');
};
E.table=L=>{
  const P=L.points;
  const rows=L.participants.map(p=>({id:p.id,name:p.name,P:0,W:0,D:0,L:0,GF:0,GA:0,GD:0,Pts:0}));
  const by={}; rows.forEach(r=>by[r.id]=r);
  const done=L.matches.filter(m=>m.status==='done');
  done.forEach(m=>{
    const A=by[m.a],B=by[m.b]; if(!A||!B) return;
    A.P++;B.P++;A.GF+=m.sa;A.GA+=m.sb;B.GF+=m.sb;B.GA+=m.sa;
    if(m.sa>m.sb){A.W++;B.L++;A.Pts+=P.win;B.Pts+=P.loss;}
    else if(m.sa<m.sb){B.W++;A.L++;B.Pts+=P.win;A.Pts+=P.loss;}
    else{A.D++;B.D++;A.Pts+=P.draw;B.Pts+=P.draw;}
  });
  rows.forEach(r=>r.GD=r.GF-r.GA);
  const h2h=group=>{
    const ids=new Set(group.map(r=>r.id)),mm=new Map(group.map(r=>[r.id,{pts:0,gd:0,gf:0}]));
    done.forEach(m=>{ if(ids.has(m.a)&&ids.has(m.b)){ const a=mm.get(m.a),b=mm.get(m.b);
      a.gf+=m.sa;b.gf+=m.sb;a.gd+=m.sa-m.sb;b.gd+=m.sb-m.sa;
      if(m.sa>m.sb){a.pts+=P.win;b.pts+=P.loss;} else if(m.sa<m.sb){b.pts+=P.win;a.pts+=P.loss;} else {a.pts+=P.draw;b.pts+=P.draw;} }});
    const out=new Map(); mm.forEach((v,id)=>out.set(id,v.pts*1e6+(v.gd+1000)*1e3+v.gf)); return out;
  };
  const key=(c,r,ctx)=>c==='pts'?r.Pts:c==='gd'?r.GD:c==='gf'?r.GF:c==='w'?r.W:(ctx.get(r.id)||0);
  const sortGroup=(group,cs)=>{
    if(group.length<2||!cs.length) return [group];
    const c=cs[0],rest=cs.slice(1),ctx=c==='h2h'?h2h(group):null;
    const vals=new Map(group.map(r=>[r.id,key(c,r,ctx)]));
    const sorted=group.slice().sort((x,y)=>vals.get(y.id)-vals.get(x.id));
    const buckets=[];
    sorted.forEach(r=>{const last=buckets[buckets.length-1]; if(last&&vals.get(last[0].id)===vals.get(r.id)) last.push(r); else buckets.push([r]);});
    return buckets.reduce((acc,b)=>acc.concat(sortGroup(b,rest)),[]);
  };
  const groups=sortGroup(rows,L.tiebreak&&L.tiebreak.length?L.tiebreak:['pts','gd','gf','h2h']);
  let pos=1; const out=[];
  groups.forEach(g=>{g.forEach(r=>{r.rank=pos;r.tied=g.length>1;out.push(r);});pos+=g.length;});
  return out;
};
E.koRanking=L=>{
  const rounds=E.koRounds(L),R=rounds.length-1,champ=rounds[R][0],res=[];
  if(typeof champ==='string') res.push({id:champ,rank:1,label:'البطل'});
  for(let r=R-1;r>=0;r--){
    const ms=L.matches.filter(m=>m.ko&&m.ko.r===r&&m.status==='done');
    const rank=res.length+1;
    ms.forEach(m=>res.push({id:E.loser(m),rank,label:r===R-1?'الوصيف':'خرج من '+roundName(r,R)}));
  }
  const seen=new Set(res.map(x=>x.id));
  const alive=L.participants.filter(p=>!seen.has(p.id)).map(p=>({id:p.id,rank:1,label:'ما زال في المنافسة',alive:true}));
  return alive.length&&typeof champ!=='string'?alive.concat(res.map(x=>Object.assign({},x,{rank:x.rank+alive.length}))):res;
};
E.validate=(L,m)=>{
  const errs=[];
  ['a','b'].forEach(s=>{
    const sc=m['s'+s],p=part(L,m[s]);
    if(!Number.isInteger(sc)||sc<0||sc>99) errs.push('النتيجة يجب أن تكون عدداً صحيحاً بين 0 و99.');
    const ev=m.events.filter(e=>e.side===s);
    if(ev.length>sc) errs.push(`مسجَّل ${ev.length} من الأهداف بأسماء لاعبي «${p?p.name:''}» بينما نتيجته ${sc}. احذف هدفاً من الإحصائيات أو عدّل النتيجة.`);
    ev.forEach(e=>{
      if(!p||!p.players.some(x=>x.id===e.scorer)) errs.push('اختر صاحب كل هدف في الإحصائيات.');
      if(e.assist&&e.assist===e.scorer&&!L.selfAssist) errs.push('لا تُحتسب التمريرة الحاسمة لصاحب الهدف نفسه. غيّر صانع الهدف أو اختر «بدون تمريرة».');
      if(e.assist&&p&&!p.players.some(x=>x.id===e.assist)) errs.push('صانع أحد الأهداف لم يعد موجوداً في الفريق.');
    });
  });
  if(L.format==='ko'&&m.sa===m.sb&&m.pk!==m.a&&m.pk!==m.b) errs.push('النتيجة تعادل في خروج المغلوب: اختر المتأهل بركلات الترجيح.');
  return errs.filter((x,i,a)=>a.indexOf(x)===i);
};
/* in individual leagues a participant is a single player, so goals can be attributed with certainty */
E.autoAttribute=(L,m)=>{
  ['a','b'].forEach(s=>{
    const p=part(L,m[s]); if(!p||L.type!=='individual'||!p.players.some(x=>x.id==='self')) return;
    const self='self', sc=m['s'+s];
    let ev=m.events.filter(e=>e.side===s);
    while(ev.length>sc){const auto=ev.filter(e=>e.auto&&!e.assist); const rm=auto.length?auto[auto.length-1]:null; if(!rm) break; m.events.splice(m.events.indexOf(rm),1); ev=m.events.filter(e=>e.side===s);}
    while(ev.length<sc){m.events.push({id:uid(),side:s,scorer:self,assist:'',auto:true}); ev=m.events.filter(e=>e.side===s);}
  });
};
E.playerStats=L=>{
  const map=new Map();
  const pl=(pid,plid)=>{const k=pid+'|'+plid; if(!map.has(k)){const p=part(L,pid),x=p&&p.players.find(y=>y.id===plid); map.set(k,{key:k,pid,plid,name:x?x.name:'لاعب محذوف',team:p?p.name:'',G:0,A:0,matches:[]});} return map.get(k);};
  L.participants.forEach(p=>p.players.forEach(x=>pl(p.id,x.id)));
  let total=0,attr=0; const incomplete=new Set();
  L.matches.filter(m=>m.status==='done').forEach(m=>{
    ['a','b'].forEach(s=>{
      const pid=m[s],sc=m['s'+s],ev=m.events.filter(e=>e.side===s);
      total+=sc; attr+=Math.min(ev.length,sc); const complete=ev.length>=sc; if(!complete) incomplete.add(pid);
      const per=new Map();
      ev.forEach(e=>{const r=pl(pid,e.scorer);r.G++;const v=per.get(r.key)||{g:0,a:0};v.g++;per.set(r.key,v);
        if(e.assist){const ra=pl(pid,e.assist);ra.A++;const va=per.get(ra.key)||{g:0,a:0};va.a++;per.set(ra.key,va);}});
      const p=part(L,pid);
      (p?p.players:[]).forEach(x=>{const r=pl(pid,x.id),v=per.get(r.key)||{g:0,a:0};r.matches.push({mid:m.id,opp:m[s==='a'?'b':'a'],gf:sc,ga:m[s==='a'?'sb':'sa'],g:v.g,a:v.a,complete});});
    });
  });
  return {players:[...map.values()],total,attr,incomplete};
};

E.parseNames=txt=>{
  const out=[];String(txt||'').split(/[\n\r,،؛;\t]+/).map(x=>x.replace(/^\s*\d+\s*[-.)]\s*/,'').trim()).forEach(x=>{if(x&&x.length<=30&&out.indexOf(x)<0)out.push(x);});

};
E.normalizeLeague=(L,t)=>{
  if(!L||typeof L!=='object'||!Array.isArray(L.participants)||!Array.isArray(L.matches)||L.participants.length<2) return null;
  const ids=new Set(L.participants.map(p=>p&&p.id));
  if(ids.size!==L.participants.length||[...ids].some(x=>typeof x!=='string')) return null;
  const n=Object.assign({},L);
  n.name=String(L.name||'دوري مستورد').slice(0,40);
  n.type=L.type==='teams'?'teams':'individual';
  n.format=['single','double','ko'].indexOf(L.format)>=0?L.format:'single';
  n.points=Object.assign({win:3,draw:1,loss:0},L.points||{});
  n.matchMin=Number(L.matchMin)>0?Number(L.matchMin):5; n.breakMin=Number(L.breakMin)>=0?Number(L.breakMin):1;
  n.tiebreak=Array.isArray(L.tiebreak)&&L.tiebreak[0]==='pts'?L.tiebreak:['pts','gd','gf','h2h','w'];
  n.adjust=L.adjust!==false; n.selfAssist=!!L.selfAssist; n.goalPrompt=L.goalPrompt!==false; n.pin=typeof L.pin==='string'?L.pin:'';
  n.participants=L.participants.map(p=>({id:p.id,name:String(p.name||'—').slice(0,30),players:Array.isArray(p.players)?p.players.filter(x=>x&&x.id).map(x=>({id:String(x.id),name:String(x.name||'—').slice(0,30)})):[]}));
  n.byes=L.byes&&typeof L.byes==='object'?L.byes:{};
  n.matches=L.matches.filter(m=>m&&(ids.has(m.a)||m.a===null)&&(ids.has(m.b)||m.b===null)).map(m=>{
    const x=Object.assign({},m);
    x.sa=Math.max(0,parseInt(m.sa,10)||0); x.sb=Math.max(0,parseInt(m.sb,10)||0);
    x.events=Array.isArray(m.events)?m.events.filter(e=>e&&(e.side==='a'||e.side==='b')):[];
    if(['pending','live','paused','scoring','done','cancelled'].indexOf(x.status)<0) x.status='pending';
    if(x.status==='live'){x.remaining=Math.max(1000,(m.endAt||t)-t);x.endAt=null;x.status='paused';}
    return x;
  });
  if(n.phase&&n.phase.kind==='break'){n.phase={kind:'ready'};}
  if(!n.phase) n.phase={kind:'idle'};
  if(n.status==='paused'||n.status==='done'||n.status==='running'){} else n.status='running';
  n.createdAt=Number(L.createdAt)||t;
  return n;
};
E.parseImport=(txt,existingIds,t)=>{
  if(!txt) return {error:'اختر ملفاً أو الصق البيانات أولاً.'};
  let d; try{d=JSON.parse(txt);}catch(e){return {error:'هذا ليس ملف نسخة احتياطية صالحاً. تأكد أنه ملف ‎.json صادر من «دوري الملعب».'};}
  let list=Array.isArray(d)?d:Array.isArray(d.leagues)?d.leagues:d.league?[d.league]:(d.participants?[d]:null);
  if(!list||!list.length) return {error:'لم نجد أي دوري داخل البيانات.'};
  const taken=new Set(existingIds),out=[];let bad=0;
  list.forEach(L=>{const n=E.normalizeLeague(L,t);if(!n){bad++;return;}
    if(!n.id||taken.has(n.id)){n.id=Math.random().toString(36).slice(2,10);if(existingIds.indexOf(L.id)>=0)n.name=n.name+' (مستورد)';}
    taken.add(n.id);out.push(n);});
  if(!out.length) return {error:'البيانات ناقصة أو تالفة، ولم يُستورد أي دوري.'};
  return {leagues:out,skipped:bad};
};

/* ---------------- model helpers ---------------- */
function newMatch(a,b,extra){return Object.assign({id:uid(),a,b,status:'pending',sa:0,sb:0,pk:null,events:[],dur:null,endAt:null,remaining:null,leftMs:null,startedAt:null,finishedAt:null},extra||{});}
const cur=()=>DB.leagues.find(l=>l.id===DB.currentId)||null;
const part=(L,id)=>L.participants.find(p=>p.id===id);
const pname=(L,id)=>{if(id===null)return 'تأهل مباشر';if(id===undefined)return 'يُحدَّد لاحقاً';const p=part(L,id);return p?p.name:'—';};
const byId=(L,id)=>L.matches.find(m=>m.id===id);
const ACTIVE=['live','paused','scoring'];
const active=L=>L.matches.find(m=>ACTIVE.indexOf(m.status)>=0)||null;
const pend=L=>L.matches.filter(m=>m.status==='pending');
const started=L=>L.matches.some(m=>m.status!=='pending'&&m.status!=='cancelled');
function leagueState(L){if(L.status==='done')return 'done';if(L.status==='paused')return 'paused';return started(L)?'running':'idle';}
function curMatch(L){return active(L)||pend(L)[0]||null;}
function nextMatch(L){const a=active(L),p=pend(L);return a?(p[0]||null):(p[1]||null);}
function totals(L){
  if(L.format==='ko'){const t=Math.max(0,L.participants.length-1),d=L.matches.filter(m=>m.status==='done').length;return {total:t,done:d,left:t-d};}
  const v=L.matches.filter(m=>m.status!=='cancelled'),d=v.filter(m=>m.status==='done').length;return {total:v.length,done:d,left:v.length-d};
}
function phase(L){
  const a=active(L); if(a) return {k:a.status,m:a};
  const p=pend(L)[0]; if(!p) return {k:'none',m:null};
  if(L.phase&&L.phase.kind==='break') return {k:'break',m:p};
  if(L.phase&&L.phase.kind==='ready') return {k:'ready',m:p};
  return {k:'idle',m:p};
}
function roundName(r,R){const left=R-r;return left===1?'النهائي':left===2?'نصف النهائي':left===3?'ربع النهائي':'دور الـ'+Math.pow(2,left);}
function roundLabel(L,m){
  if(L.format==='ko'&&m.ko) return roundName(m.ko.r,Math.round(Math.log2(L.ko.size)));
  if(m.extra) return 'مباراة إضافية';
  if(!m.round) return '';
  if(m.extraRound) return 'الجولة '+m.round+' · دور إضافي';
  return 'الجولة '+m.round+(L.format==='double'?(m.leg===2?' · الإياب':' · الذهاب'):'');
}
function matchRemaining(L,m){
  if(!m) return 0;
  if(m.status==='live') return Math.max(0,m.endAt-now());
  if(m.status==='paused') return Math.max(0,m.remaining||0);
  if(m.status==='scoring'||m.status==='done') return 0;
  return Math.round(L.matchMin*60000);
}
function breakRemaining(L){const ph=L.phase;if(!ph||ph.kind!=='break')return 0;return ph.endAt?Math.max(0,ph.endAt-now()):Math.max(0,ph.remaining||0);}
function moveToNext(L,m){
  const i=L.matches.indexOf(m); L.matches.splice(i,1);
  let j=L.matches.findIndex(x=>x.status==='pending'); if(j<0) j=L.matches.length;
  L.matches.splice(j,0,m);
}
function buildSchedule(L,starter){
  const ids=L.participants.map(p=>p.id); L.byes={};
  if(L.format==='ko'){
    let size=1; while(size<ids.length) size*=2;
    L.ko={size,slots:E.seedOrder(size).map(s=>s<=ids.length?ids[s-1]:null)}; L.matches=[]; E.koSync(L);
    if(starter){const m=L.matches.find(x=>x.a===starter||x.b===starter); if(m) moveToNext(L,m);}
    return;
  }
  const rr=E.roundRobin(ids,L.format==='double'?2:1); L.byes=rr.byes;
  L.matches=E.arrange(rr.matches,starter).map(x=>newMatch(x.a,x.b,{round:x.round,leg:x.leg}));
}
const matchCount=(n,f)=>n<2?0:f==='ko'?n-1:f==='double'?n*(n-1):n*(n-1)/2;

/* ---------------- sound, vibration, wake lock ---------------- */
let actx=null;
function unlockAudio(){try{if(!actx){const C=window.AudioContext||window.webkitAudioContext;if(C)actx=new C();}if(actx&&actx.state==='suspended')actx.resume();}catch(e){}}
function whistle(t0,dur){
  const o=actx.createOscillator(),g=actx.createGain(),lfo=actx.createOscillator(),lg=actx.createGain();
  o.type='sine';o.frequency.value=2850;lfo.frequency.value=26;lg.gain.value=140;
  lfo.connect(lg);lg.connect(o.frequency);o.connect(g);g.connect(actx.destination);
  g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(0.32,t0+0.02);
  g.gain.setValueAtTime(0.32,t0+dur-0.05);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.start(t0);lfo.start(t0);o.stop(t0+dur+0.05);lfo.stop(t0+dur+0.05);
}
function beep(t0,f,dur){const o=actx.createOscillator(),g=actx.createGain();o.type='triangle';o.frequency.value=f;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(0.4,t0+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);o.start(t0);o.stop(t0+dur+0.03);}
function alarm(kind){
  if(DB.prefs.vibrate){try{navigator.vibrate&&navigator.vibrate(kind==='end'?[400,120,400,120,800]:kind==='ready'?[250,120,250]:[120]);}catch(e){}}
  if(!DB.prefs.sound) return;
  try{ unlockAudio(); if(!actx) return; const t=actx.currentTime+0.03;
    if(kind==='start') whistle(t,0.45);
    else if(kind==='end'){whistle(t,0.28);whistle(t+0.4,0.28);whistle(t+0.8,1.1);}
    else if(kind==='ready'){beep(t,880,0.18);beep(t+0.26,880,0.18);beep(t+0.52,1320,0.4);}
    else if(kind==='win'){[523,659,784,1047].forEach((f,i)=>beep(t+i*0.16,f,0.3));}
  }catch(e){}
}
let wakeLock=null;
async function keepAwake(on){
  try{
    if(on){ if(!wakeLock&&navigator.wakeLock&&document.visibilityState==='visible'){wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null;});} }
    else if(wakeLock){const w=wakeLock;wakeLock=null;await w.release();}
  }catch(e){wakeLock=null;}
}
function syncWake(){const L=cur();const need=!!(L&&L.status!=='paused'&&((active(L)&&active(L).status==='live')||(L.phase&&L.phase.kind==='break')));keepAwake(need);}

  out+=`<div class="kpis"><div class="kpi"><b>${L.participants.length}</b><span>المشاركون</span></div><div class="kpi"><b>${t.total}</b><span>المباريات الكلية</span></div><div class="kpi"><b>${t.done}</b><span>المكتملة</span></div><div class="kpi"><b>${t.left}</b><span>المتبقية</span></div></div>`;
  if(nm&&st!=='done') out+=`<div class="card"><div class="sec-head"><h3>المباراة القادمة</h3><span class="chip">${matchLabel(L.matches.indexOf(nm))}</span></div><div class="mt"><b>${esc(pname(L,nm.a))}</b><span class="vs">ضد</span><b>${esc(pname(L,nm.b))}</b></div></div>`;
  if(L.format!=='ko'&&t.done){
    const tb=E.table(L).slice(0,3);
    out+=`<div class="card"><div class="sec-head"><h3>${st==='done'?'الترتيب النهائي':'المتصدرون الآن'}</h3><button class="btn btn-sm" data-act="go" data-v="standings">الجدول كاملاً</button></div><div class="lb">${tb.map(r=>`<div class="lb-row"><span class="rank">${r.rank}</span><span class="who"><span>${esc(r.name)}</span><small>لعب ${r.P} · فارق ${r.GD>0?'+':''}${r.GD}</small></span><b>${r.Pts}</b></div>`).join('')}</div></div>`;
  }
  const tops=topScorers(L,5);
  if(tops.length) out+=`<div class="card"><div class="sec-head"><h3>الهدافون</h3><button class="btn btn-sm" data-act="go" data-v="stats">كل الإحصائيات</button></div><div class="lb">${tops.map(r=>`<div class="lb-row"><span class="rank">${r.rk}</span><span class="who"><span>${esc(r.name)}</span><small>${L.type==='teams'||r.team!==r.name?esc(r.team)+' · ':''}${r.A} أسيست</small></span><b>${r.G}</b></div>`).join('')}</div></div>`;
  out+=installBanner();
  out+=`<div class="quick">
   <button class="btn" data-act="go" data-v="standings">${ic('table')} جدول الترتيب</button>
   <button class="btn" data-act="go" data-v="schedule">${ic('list')} جدول المباريات</button>
   <button class="btn" data-act="go" data-v="stats">${ic('chart')} إحصائيات اللاعبين</button>
   <button class="btn" data-act="go" data-v="manage">${ic('users')} المشاركون والإعدادات</button>
   <button class="btn" data-act="newLeague">${ic('plus')} دوري جديد</button>
  </div>`;
  return out;
}
function topScorers(L,n){
  const arr=E.playerStats(L).players.filter(r=>r.G>0).sort((a,b)=>b.G-a.G||b.A-a.A);
  arr.forEach(r=>{r.rk=arr.findIndex(x=>x.G===r.G)+1;});
  return arr.slice(0,n);
}
function headline(L){
  if(L.format==='ko'){const r=E.koRanking(L);const c=r.find(x=>x.rank===1&&!x.alive);return c?'البطل: '+pname(L,c.id):'لم يُحسم اللقب';}
  const tb=E.table(L),top=tb.filter(r=>r.rank===1);
  if(!tb.length) return '';
  const names=top.map(r=>r.name).join(' و ');
  if(L.endedManually) return 'المتصدر: '+names;
  return (top.length>1?'تعادل على اللقب: ':'البطل: ')+names;
}
function liveCard(L){
  const ph=phase(L),m=ph.m;
  if(ph.k==='none') return `<div class="card"><h3>لا توجد مباريات متبقية</h3><p class="muted">كل المباريات المتبقية ملغاة. يمكنك استعادة مباراة من جدول المباريات أو إنهاء الدوري من الإدارة.</p></div>`;
  const LBL={live:'المباراة جارية',paused:'متوقفة مؤقتاً',scoring:'بانتظار تسجيل النتيجة',break:'استراحة بين المباريات',ready:'المباراة التالية جاهزة',idle:'جاهزون لصافرة البداية'};
  let clock;
  if(ph.k==='break') clock=`<div class="clock sm" data-clock="break">${fmt(breakRemaining(L))}</div>`;
  else clock=`<div class="clock sm ${ph.k==='scoring'?'zero':''}" ${ACTIVE.indexOf(ph.k)>=0?'data-clock="match"':''}>${fmt(matchRemaining(L,m))}</div>`;
  const score=ACTIVE.indexOf(ph.k)>=0?`<span class="sc">${sc2(m.sa,m.sb)}</span>`:'<span>ضد</span>';
  let btn;
  if(ph.k==='idle'||ph.k==='ready') btn=`<button class="btn btn-chalk btn-xl" data-act="start" ${L.status==='paused'?'disabled':''}>${ic('play')} ${ph.k==='ready'?'بدء المباراة التالية':'بدء المباراة'}</button>`;
  else if(ph.k==='paused') btn=`<button class="btn btn-chalk btn-xl" data-act="resume" ${L.status==='paused'?'disabled':''}>${ic('play')} استئناف المباراة</button>`;
  else btn=`<button class="btn btn-chalk btn-xl" data-act="go" data-v="match">${ic('timer')} ${ph.k==='scoring'?'سجّل النتيجة':ph.k==='break'?'شاشة الاستراحة':'شاشة المباراة'}</button>`;
  return `<section class="pitch">${PITCH_LINES}<div class="pitch-in">
   <div class="pitch-top"><span class="state-chip ${ph.k==='live'?'live':''}"><i></i>${LBL[ph.k]}</span><span class="eyebrow">${ph.k==='break'?'التالية: ':''}${matchLabel(L.matches.indexOf(m))}</span></div>
   <div class="vs-line"><b>${esc(pname(L,m.a))}</b>${score}<b>${esc(pname(L,m.b))}</b></div>
   ${clock}${btn}</div></section>`;
}

/* ---- match screen ---- */
function vMatch(L){
  if(L.status==='done') return `<div class="card"><h3>انتهى الدوري</h3><p class="muted">${esc(headline(L))}</p><button class="btn btn-primary" data-act="go" data-v="champion">${ic('trophy')} شاشة التتويج</button></div>`;
  const ph=phase(L),t=totals(L);
  if(ph.k==='none') return liveCard(L);
  const m=ph.m,i=L.matches.indexOf(m),isAct=ACTIVE.indexOf(ph.k)>=0,locked=L.status==='paused';
  const rest=L.byes&&m.round&&L.byes[m.round]?`<span class="chip">في استراحة هذه الجولة: ${esc(pname(L,L.byes[m.round]))}</span>`:'';
  const doneCount=t.done;
  let head=`<div class="sec-head"><div><span class="eyebrow">${esc(L.name)} · ${roundLabel(L,m)}</span><h2>${ph.k==='break'?'الاستراحة':matchLabel(i)} <span class="muted small num">(${Math.min(doneCount+1,t.total)} من ${t.total})</span></h2></div>${rest}</div>`;
  let pitch, ctrl='';
  const remain=matchRemaining(L,m), dur=m.dur||Math.round(L.matchMin*60000);
  const stateChip={live:'<span class="state-chip live"><i></i>جارية</span>',paused:'<span class="state-chip"><i></i>متوقفة مؤقتاً</span>',scoring:'<span class="state-chip"><i></i>انتهى الوقت · سجّل النتيجة</span>',idle:'<span class="state-chip"><i></i>لم تبدأ</span>',ready:'<span class="state-chip"><i></i>جاهزة للبدء</span>',break:'<span class="state-chip"><i></i>استراحة</span>'}[ph.k];
  if(ph.k==='break'){
    const br=breakRemaining(L),tot=L.phase.total||1;
    pitch=`<section class="pitch">${PITCH_LINES}<div class="pitch-in"><div class="pitch-top">${stateChip}<span class="eyebrow">التالية: ${matchLabel(i)}</span></div>
     <div class="clock" data-clock="break">${fmt(br)}</div><div class="bar"><i data-prog="break" style="width:${Math.min(100,100*(1-br/tot))}%"></i></div>
     <div class="vs-line"><b>${esc(pname(L,m.a))}</b><span>ضد</span><b>${esc(pname(L,m.b))}</b></div></div></section>`;
    ctrl=`<div class="ctrl"><button class="btn btn-primary btn-xl" data-act="start" ${locked?'disabled':''}>${ic('play')} ابدأ المباراة التالية الآن</button>
     <div class="ctrl-row"><button class="btn" data-act="skipBreak" ${locked?'disabled':''}>${ic('skip')} تخطي الاستراحة</button><button class="btn" data-act="extendBreak" ${locked?'disabled':''}>${ic('plus')} تمديد دقيقة</button></div>
     ${lastResult(L)}</div>`;
  } else {
    pitch=`<section class="pitch">${PITCH_LINES}<div class="pitch-in"><div class="pitch-top">${stateChip}<span class="eyebrow num">مدة المباراة ${fmt(dur)}</span></div>
     <div class="clock ${ph.k==='scoring'?'zero':(isAct&&remain<=60000?'low':'')}" ${isAct?'data-clock="match"':''}>${fmt(remain)}</div>
     <div class="bar"><i ${isAct?'data-prog="match"':''} style="width:${isAct?Math.min(100,100*(1-remain/dur)):0}%"></i></div></div></section>`;
    if(ph.k==='idle'||ph.k==='ready'){
      ctrl=`<div class="ctrl"><div class="board"><div class="side"><div class="side-name">${esc(pname(L,m.a))}</div></div><div class="colon" style="padding-top:0">ضد</div><div class="side"><div class="side-name">${esc(pname(L,m.b))}</div></div></div>
       <button class="btn btn-primary btn-xl" data-act="start" ${locked?'disabled':''}>${ic('play')} ${ph.k==='ready'?'بدء المباراة التالية':'بدء المباراة'}</button>
       <p class="hint">الوقت لا يبدأ إلا بعد الضغط على الزر، حتى يكون اللاعبون مستعدين.</p>${lastResult(L)}</div>`;
    } else {
      const adj=L.adjust?`<div class="adj"><button class="btn" data-act="adj" data-ms="-60000">−1 د</button><button class="btn" data-act="adj" data-ms="-30000">−30 ث</button><button class="btn" data-act="adj" data-ms="30000">+30 ث</button><button class="btn" data-act="adj" data-ms="60000">+1 د</button></div>`:'';
      let buttons='';
      if(ph.k==='live') buttons=`<div class="ctrl-row"><button class="btn btn-ink btn-xl" data-act="pause">${ic('pause')} إيقاف</button><button class="btn btn-danger btn-xl" data-act="endEarly">${ic('stop')} إنهاء</button></div>${adj}`;
      else if(ph.k==='paused') buttons=`<div class="ctrl-row"><button class="btn btn-primary btn-xl" data-act="resume" ${locked?'disabled':''}>${ic('play')} استئناف</button><button class="btn btn-danger btn-xl" data-act="endEarly">${ic('stop')} إنهاء</button></div>${adj}`;
      else {
        const errs=E.validate(L,previewAttr(L,m));
        buttons=`${errs.length?`<div class="errs">${errs.map(e=>`<div><b>!</b> ${esc(e)}</div>`).join('')}</div>`:''}
         <button class="btn btn-primary btn-xl" data-act="confirm" ${errs.length?'disabled':''}>${ic('check')} تأكيد النتيجة <span class="ltr">${sc2(m.sa,m.sb)}</span></button>
         ${m.leftMs>0?`<button class="btn" data-act="undoEnd">${ic('replay')} أُنهيت بالخطأ؟ عودة للمباراة (${fmt(m.leftMs)})</button>`:''}`;
      }
      ctrl=`<div class="ctrl">${board(L,m,'live')}${koPk(L,m,'live')}${buttons}${goalLog(L,m,'live')}</div>`;
    }
  }
  const nm=ph.k==='break'?pend(L)[1]:nextMatch(L);
  const strip=`<div class="note">${nm?`بعدها: <b>${esc(pname(L,nm.a))}</b> ضد <b>${esc(pname(L,nm.b))}</b>`:'هذه آخر مباراة متاحة حالياً.'}</div>`;
  return pausedBanner(L)+head+`<div class="match-grid"><div class="stack">${pitch}${strip}</div><div class="stack">${ctrl}</div></div>`;
}
function lastResult(L){
  const d=L.matches.filter(m=>m.status==='done').sort((a,b)=>(b.finishedAt||0)-(a.finishedAt||0))[0];
  return d?`<div class="note ok">آخر نتيجة: <b>${esc(pname(L,d.a))} <span class="ltr">${sc2(d.sa,d.sb)}</span> ${esc(pname(L,d.b))}</b></div>`:'';
}
function board(L,m,t){
  const side=s=>`<div class="side"><div class="side-name">${esc(pname(L,m[s]))}</div><div class="score-big" aria-live="polite">${m['s'+s]}</div>
   <div class="stepper"><button data-act="sc" data-t="${t}" data-s="${s}" data-d="-1" aria-label="إنقاص هدف" ${m['s'+s]<=0?'disabled':''}>${ic('minus')}</button><button class="plus" data-act="sc" data-t="${t}" data-s="${s}" data-d="1" aria-label="إضافة هدف">${ic('plus')}</button></div></div>`;
  return `<div class="board">${side('a')}<div class="colon">:</div>${side('b')}</div>`;
}
function koPk(L,m,t){
  if(L.format!=='ko'||m.sa!==m.sb) return '';
  return `<div class="pk"><b>تعادل: من تأهل بركلات الترجيح؟</b><div class="row">${['a','b'].map(s=>`<button class="btn grow" data-act="pk" data-t="${t}" data-p="${m[s]}" aria-pressed="${m.pk===m[s]}">${esc(pname(L,m[s]))}</button>`).join('')}</div></div>`;
}
function previewAttr(L,m){const c=clone(m);E.autoAttribute(L,c);return c;}
function goalLog(L,m,t){
  const prompt=L.goalPrompt!==false;
  const sideHtml=s=>{
    const p=part(L,m[s]),ev=m.events.filter(e=>e.side===s),sc=m['s'+s],missing=Math.max(0,sc-ev.length);
    const pn=id=>{const x=p.players.find(y=>y.id===id);return x?x.name:'لاعب محذوف';};
    const selfName=L.type==='individual'&&p.players.some(x=>x.id==='self');
    return `<div class="st-side"><h4><span>${esc(p.name)}</span><span class="chip ${missing&&!selfName?'warn':'ok'} num">${sc} ${sc===1?'هدف':'أهداف'}</span></h4>
     ${ev.map(e=>`<div class="goal"><span class="gno">${ic('ball')}</span><button class="goal-main" data-act="goalEdit" data-t="${t}" data-id="${e.id}" aria-label="تعديل الهدف"><b>${esc(pn(e.scorer))}</b>${e.assist?`<small>${ic('assist')} أسيست: ${esc(pn(e.assist))}</small>`:'<small>بدون أسيست</small>'}</button><button class="icon-btn" data-act="goalDel" data-t="${t}" data-id="${e.id}" aria-label="حذف الهدف">${ic('trash')}</button></div>`).join('')}
     ${Array.from({length:missing},()=>`<button class="goal goal-unk" data-act="goalAssign" data-t="${t}" data-s="${s}"><span class="gno">${ic('ball')}</span><span class="goal-main"><b>هدف بدون اسم</b><small>${selfName?'سيُحسب لـ '+esc(p.name)+' · ':''}اضغط لإضافة الهداف والأسيست</small></span></button>`).join('')}
    </div>`;
  };
  return `<div class="stats-box"><h3 class="gl-title">${ic('ball')} الأهداف والهدافون</h3>
   <label class="chk" style="padding:0"><input type="checkbox" id="gp-${t}" data-in="set.goalPrompt" ${prompt?'checked':''}><span>عند كل هدف: اسأل عن اسم الهداف وصاحب الأسيست</span></label>
   ${m.sa+m.sb?sideHtml('a')+sideHtml('b'):'<p class="hint">لا أهداف بعد. اضغط + تحت اسم الفريق عند تسجيل هدف.</p>'}</div>`;
}
function renderGoal(){
  const root=$('#goal-root'),g=ui.goal,L=cur();
  if(!g||!L){root.innerHTML='';return;}
  const m=tgt(g.t); if(!m){ui.goal=null;root.innerHTML='';return;}
  const p=part(L,m[g.side]);
  const chips=f=>p.players.filter(x=>f==='scorer'||L.selfAssist||x.id!==g.scorer).map(x=>`<button data-act="gPick" data-f="${f}" data-id="${x.id}" aria-pressed="${g[f]===x.id}">${esc(x.name)}</button>`).join('');
  const title=g.mode==='edit'?'تعديل الهدف':'هدف لـ '+p.name;
  root.innerHTML=`<div class="sheet-ov goal-ov" data-act="gOv"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}">
   <div class="sheet-head"><h3>${esc(title)}</h3><button class="icon-btn" data-act="gClose" aria-label="إغلاق">${ic('x')}</button></div>
   <div class="stack"><span class="lbl">من سجّل الهدف؟</span>
    ${p.players.length?`<div class="seg pick">${chips('scorer')}</div>`:'<p class="hint">اكتب اسم اللاعب، وسيُحفظ لباقي المباريات.</p>'}
    <div class="row"><input type="text" id="g-new-scorer" placeholder="اسم لاعب جديد" maxlength="30" autocomplete="off" enterkeyhint="done" style="flex:1 1 150px"><button class="btn btn-sm" data-act="gNew" data-f="scorer">${ic('plus')} إضافة</button></div></div>
   <div class="stack"><span class="lbl">من صنع الهدف (أسيست)؟</span>
    <div class="seg pick"><button data-act="gPick" data-f="assist" data-id="" aria-pressed="${!g.assist}">بدون أسيست</button>${chips('assist')}</div>
    <div class="row"><input type="text" id="g-new-assist" placeholder="اسم لاعب جديد" maxlength="30" autocomplete="off" enterkeyhint="done" style="flex:1 1 150px"><button class="btn btn-sm" data-act="gNew" data-f="assist">${ic('plus')} إضافة</button></div></div>
   <button class="btn btn-primary btn-xl" data-act="gSave" ${g.scorer?'':'disabled'}>${ic('check')} ${g.mode==='edit'?'حفظ التعديل':'تسجيل الهدف'}</button>
   ${g.mode==='new'?`<button class="btn" data-act="gNoName">تسجيل الهدف بدون اسم</button>`:''}
  </div></div>`;
}
/* ---- schedule ---- */
function vSchedule(L){
  const t=totals(L),cm=L.status==='done'?null:curMatch(L),nm=L.status==='done'?null:nextMatch(L);
  let out=`<div class="sec-head"><h2>جدول المباريات</h2><span class="chip num">${t.done} من ${t.total} مكتملة</span></div>`;
  if(L.format!=='ko') out+=`<button class="btn" data-act="addMatches">${ic('plus')} إضافة مباريات للدوري</button>`;
  const byes=Object.keys(L.byes||{});
  if(byes.length) out+=`<div class="note"><b>الاستراحات (العدد فردي):</b> في كل جولة يرتاح مشارك واحد، ولا تُحتسب الاستراحة خسارة.<div class="mmeta" style="margin-top:6px">${byes.map(r=>`<span class="chip">الجولة ${r}: ${esc(pname(L,L.byes[r]))}</span>`).join('')}</div></div>`;
  if(L.format==='ko'){const byeIds=L.ko.slots.map((s,i,a)=>s&&a[i%2?i-1:i+1]===null?s:null).filter(Boolean); if(byeIds.length) out+=`<div class="note"><b>تأهل مباشر للدور الثاني:</b> ${byeIds.map(id=>esc(pname(L,id))).join('، ')}</div>`;}
  out+=`<div class="mlist">${L.matches.map((m,i)=>mrow(L,m,i,cm,nm)).join('')}</div>`;
  if(L.format==='ko'&&L.status!=='done') out+=`<p class="hint">مباريات الأدوار التالية تظهر تلقائياً عند معرفة المتأهلين.</p>`;
  out+=`<p class="hint">اضغط على أي مباراة لعرض تفاصيلها أو تصحيح نتيجتها. استخدم الأسهم لتغيير ترتيب المباريات التي لم تبدأ.</p>`;
  return out;
}
function statusChip(m,isCur){
  if(m.status==='done') return '<span class="chip ok">انتهت</span>';
  if(m.status==='live') return '<span class="chip live">جارية الآن</span>';
  if(m.status==='paused') return '<span class="chip warn">متوقفة</span>';
  if(m.status==='scoring') return '<span class="chip warn">بانتظار النتيجة</span>';
  if(m.status==='cancelled') return '<span class="chip">ملغاة</span>';
  return isCur?'<span class="chip live">الحالية</span>':'<span class="chip">لم تبدأ</span>';
}
function mrow(L,m,i,cm,nm){
  const cls=m===cm?'is-current':m===nm?'is-next':m.status==='cancelled'?'is-cancelled':'';
  const showSc=m.status==='done'||ACTIVE.indexOf(m.status)>=0;
  const pens=m.status==='done'&&L.format==='ko'&&m.sa===m.sb?`<span class="chip">ترجيح: ${esc(pname(L,m.pk))}</span>`:'';
  const gaps=m.status==='done'&&m.events.length<m.sa+m.sb?'<span class="chip">إحصائيات ناقصة</span>':'';
  const canMove=m.status==='pending';
  return `<div class="mrow ${cls}"><button class="mmain" data-act="openMatch" data-id="${m.id}"><span class="mno num">${i+1}</span><span class="mbody">
   <span class="mt"><b>${esc(pname(L,m.a))}</b><span class="${showSc?'msc':'vs'}">${showSc?sc2(m.sa,m.sb):'ضد'}</span><b>${esc(pname(L,m.b))}</b></span>
   <span class="mmeta">${statusChip(m,m===cm)}${m===nm?'<span class="chip">القادمة</span>':''}<span>${roundLabel(L,m)}</span>${pens}${gaps}</span></span></button>
   ${canMove?`<span class="arrows"><button class="icon-btn" data-act="mv" data-id="${m.id}" data-d="-1" aria-label="تقديم">${ic('up')}</button><button class="icon-btn" data-act="mv" data-id="${m.id}" data-d="1" aria-label="تأخير">${ic('down')}</button></span>`:'<span></span>'}</div>`;
}

/* ---- standings ---- */
function vStandings(L){
  if(L.format==='ko') return vBracket(L);
  const tb=E.table(L),complete=L.status==='done'&&!L.endedManually;
  const P=L.points;

  ${tb.map(r=>`<tr class="${complete&&r.rank===1?'first':''}"><td class="rank">${r.rank}${r.tied?'=':''}</td><td class="name">${esc(r.name)}${complete&&r.rank===1?' <span class="chip gold">البطل</span>':''}</td><td>${r.P}</td><td>${r.W}</td><td>${r.D}</td><td>${r.L}</td><td>${r.GF}</td><td>${r.GA}</td><td class="ltr">${r.GD>0?'+':''}${r.GD}</td><td class="pts">${r.Pts}</td></tr>`).join('')}
  </tbody></table></div>
  <div class="note"><b>كيف يُرتَّب الجدول؟</b> حسب ${L.tiebreak.map(c=>TB_LABEL[c]).join('، ثم ')}. إذا تساوى مشاركان في كل المعايير يظهر المركز نفسه مع علامة «=».<br>النقاط: فوز ${P.win}، تعادل ${P.draw}، خسارة ${P.loss}. تعديل هذه القواعد من «الإدارة».</div>
  ${!complete&&totals(L).left>0?`<p class="hint">لا يُعلن البطل قبل اكتمال كل المباريات (${totals(L).left} متبقية).</p>`:''}
  <button class="btn" data-act="exportCsv">${ic('download')} تصدير النتائج والترتيب CSV</button>`;
}
function vBracket(L){
  const rounds=E.koRounds(L),R=rounds.length-1;
  let cols='';
  for(let r=0;r<R;r++){
    let boxes='';
    for(let k=0;k<rounds[r].length/2;k++){
      const a=rounds[r][2*k],b=rounds[r][2*k+1];
      if(a===null&&b===null) continue;
      const m=L.matches.find(x=>x.ko&&x.ko.r===r&&x.ko.k===k);
      const w=m&&m.status==='done'?E.winner(m):(a===null?b:b===null?a:undefined);
      const line=(id,sc)=>`<div class="${id===undefined?'tbd':''} ${w&&id===w?'w':''}"><span>${esc(pname(L,id))}</span><span class="num">${sc==null?'':sc}</span></div>`;
      boxes+=`<div class="bm">${line(a,m&&m.status==='done'?m.sa:null)}${line(b,m&&m.status==='done'?m.sb:null)}</div>`;
    }
    cols+=`<div class="bcol"><h4>${roundName(r,R)}</h4>${boxes}</div>`;
  }
  const champ=rounds[R][0];
  cols+=`<div class="bcol"><h4>البطل</h4><div class="bm"><div class="${typeof champ==='string'?'w':'tbd'}"><span>${typeof champ==='string'?esc(pname(L,champ)):'يُحدَّد بعد النهائي'}</span>${typeof champ==='string'?ic('trophy'):''}</div></div></div>`;
  return `<div class="sec-head"><h2>شجرة خروج المغلوب</h2></div><div class="bracket">${cols}</div>
  <div class="note">الفائز يتأهل للدور التالي. عند التعادل يُختار المتأهل بركلات الترجيح عند تسجيل النتيجة.</div>
  <button class="btn" data-act="exportCsv">${ic('download')} تصدير النتائج CSV</button>`;
}

/* ---- player stats ---- */
function vStats(L){
  const S=E.playerStats(L),done=L.matches.filter(m=>m.status==='done').length;
  let out=`<div class="sec-head"><h2>إحصائيات اللاعبين</h2></div>`;
  if(!done) return out+`<div class="card"><h3>لا توجد مباريات منتهية بعد</h3><p class="muted">بعد تأكيد أول نتيجة تظهر هنا قوائم الهدافين وصانعي الأهداف. تسجيل أسماء الهدافين اختياري من شاشة المباراة.</p></div>`;
  const pct=S.total?Math.round(100*S.attr/S.total):100;
  out+=`<div class="note ${S.attr<S.total?'warn':'ok'}"><b>${S.attr} من ${S.total}</b> هدفاً منسوبة لأصحابها (${pct}%). ${S.attr<S.total?'الأرقام تشمل المسجَّل فقط. المشارك الذي لديه أهداف غير منسوبة يظهر بجانبه «بيانات ناقصة»، فلا تُعد أصفاره نهائية.':'كل الأهداف مسجّلة بأسماء أصحابها.'}</div>`;
  const tag=r=>S.incomplete.has(r.pid)?' <span class="chip warn">بيانات ناقصة</span>':'';
  const sub=r=>L.type==='teams'?esc(r.team):(r.team!==r.name?esc(r.team):'');
  const list=(title,arr,val)=>`<div class="card"><h3>${title}</h3>${arr.length?`<div class="lb">${arr.map((r,i,a)=>{const rk=a.findIndex(x=>val(x)===val(r))+1;return `<div class="lb-row"><span class="rank">${rk}</span><span class="who"><span>${esc(r.name)}${tag(r)}</span><small>${sub(r)}</small></span><b>${val(r)}</b></div>`;}).join('')}</div>`:'<p class="muted">لم يُسجَّل شيء بعد.</p>'}</div>`;
  const P=S.players;
  const scorers=P.filter(r=>r.G>0).sort((a,b)=>b.G-a.G||b.A-a.A);
  const assisters=P.filter(r=>r.A>0).sort((a,b)=>b.A-a.A||b.G-a.G);
  const contrib=P.filter(r=>r.G+r.A>0).sort((a,b)=>(b.G+b.A)-(a.G+a.A)||b.G-a.G);
  out+=`<div class="grid2">${list('ترتيب الهدافين',scorers,r=>r.G)}${list('ترتيب صانعي الأهداف',assisters,r=>r.A)}</div>${list('المساهمات التهديفية (أهداف + تمريرات)',contrib,r=>r.G+r.A)}`;
  const sel=ui.statsPlayer, pick=P.find(r=>r.key===sel);
  out+=`<div class="card"><h3>لاعب محدد</h3><select id="statsPlayer" data-in="statsPlayer" data-re="1" aria-label="اختر لاعباً"><option value="">اختر لاعباً…</option>${L.participants.map(p=>`<optgroup label="${esc(p.name)}">${P.filter(r=>r.pid===p.id).map(r=>`<option value="${r.key}" ${r.key===sel?'selected':''}>${esc(r.name)}</option>`).join('')}</optgroup>`).join('')}</select>`;
  if(pick){
    out+=`<div class="kpis"><div class="kpi"><b>${pick.G}</b><span>أهداف</span></div><div class="kpi"><b>${pick.A}</b><span>تمريرات حاسمة</span></div><div class="kpi"><b>${pick.G+pick.A}</b><span>مساهمات</span></div><div class="kpi"><b>${pick.matches.length}</b><span>مباريات ${L.type==='teams'?'فريقه':'له'}</span></div></div>`;
    out+=pick.matches.length?`<div class="tbl-wrap"><table><thead><tr><th style="text-align:right">المنافس</th><th>النتيجة</th><th>أهداف</th><th>تمريرات</th></tr></thead><tbody>${pick.matches.map(x=>{const unk=!x.complete;return `<tr><td class="name">${esc(pname(L,x.opp))}</td><td class="ltr">${sc2(x.gf,x.ga)}</td><td>${x.g||(unk?'<span class="muted">غير مسجَّل</span>':'0')}</td><td>${x.a||(unk?'<span class="muted">غير مسجَّل</span>':'0')}</td></tr>`;}).join('')}</tbody></table></div><p class="hint">«غير مسجَّل» تعني أن أهداف الفريق في تلك المباراة لم تُنسب كلها لأصحابها، فلا نعرف إن كان رصيده صفراً فعلاً.</p>`:'<p class="muted">لا مباريات منتهية بعد.</p>';
  }
  out+='</div>';
  return out;
}

/* ---- champion ---- */
function vChampion(L){
  let champs=[],podium=[],rest=[];
  if(L.format==='ko'){
    const r=E.koRanking(L);
    champs=r.filter(x=>x.rank===1).map(x=>pname(L,x.id));
    podium=r.filter(x=>x.rank>1).slice(0,3).map(x=>({t:x.label,n:pname(L,x.id)}));
    rest=r.map(x=>({rank:x.rank,name:pname(L,x.id),info:x.label}));
  } else {
    const tb=E.table(L);
    champs=tb.filter(x=>x.rank===1).map(x=>x.name);
    podium=tb.filter(x=>x.rank>1).slice(0,2).map(x=>({t:x.rank===2?'الوصيف':'المركز '+x.rank,n:x.name+' · '+x.Pts+' نقطة'}));
    rest=tb.map(x=>({rank:x.rank+(x.tied?'=':''),name:x.name,info:x.Pts+' نقطة · فارق '+(x.GD>0?'+':'')+x.GD}));
  }
  const manual=L.endedManually;
  const title=manual?'المتصدر عند إنهاء الدوري':champs.length>1?'تعادل كامل على اللقب':'بطل '+L.name;
  return `<section class="champ">${PITCH_LINES}${TROPHY}<span class="eyebrow">${esc(title)}</span><h1>${champs.map(esc).join('<br>')||'—'}</h1>
   ${manual?'<p>أُنهي الدوري يدوياً قبل اكتمال كل المباريات، لذلك هذا ترتيب لحظة الإنهاء.</p>':champs.length>1?'<p>تساوى المتصدرون في كل معايير الترتيب. يمكنكم لعب مباراة فاصلة ودية.</p>':''}
   ${podium.length?`<div class="podium">${podium.map(p=>`<div><small>${esc(p.t)}</small><b>${esc(p.n)}</b></div>`).join('')}</div>`:''}
   ${(()=>{const S=E.playerStats(L).players;const g=S.filter(r=>r.G>0).sort((a,b)=>b.G-a.G||b.A-a.A),a=S.filter(r=>r.A>0).sort((x,y)=>y.A-x.A||y.G-x.G);const items=[];
     if(g.length){const best=g.filter(r=>r.G===g[0].G);items.push(`<div><small>هداف الدوري</small><b>${best.map(r=>esc(r.name)).join('، ')} · ${g[0].G} ${g[0].G===1?'هدف':'أهداف'}</b></div>`);}
     if(a.length){const best=a.filter(r=>r.A===a[0].A);items.push(`<div><small>ملك الأسيست</small><b>${best.map(r=>esc(r.name)).join('، ')} · ${a[0].A}</b></div>`);}
     return items.length?`<div class="podium">${items.join('')}</div>`:'';})()}</section>
  <div class="card"><h3>الترتيب النهائي</h3><div class="lb">${rest.map(r=>`<div class="lb-row"><span class="rank">${r.rank}</span><span class="who"><span>${esc(r.name)}</span><small>${esc(r.info)}</small></span><span></span></div>`).join('')}</div></div>
  <div class="quick"><button class="btn" data-act="go" data-v="standings">${ic('table')} الجدول</button><button class="btn" data-act="go" data-v="stats">${ic('chart')} الإحصائيات</button><button class="btn" data-act="exportCsv">${ic('download')} تصدير CSV</button>${L.format!=='ko'?`<button class="btn" data-act="addMatches">${ic('plus')} مباريات إضافية</button>`:''}<button class="btn btn-primary" data-act="newLeague">${ic('plus')} دوري جديد</button></div>`;
}

/* ---- sheets (in-page dialogs) ---- */
function renderSheet(){
  const root=$('#sheet-root'),s=ui.sheet,L=cur();
  if(!s){root.innerHTML='';return;}
  let inner='';
  if(s.type==='confirm') inner=`<div class="sheet-head"><h3>${esc(s.title)}</h3></div><p>${esc(s.text)}</p><div class="ctrl-row"><button class="btn ${s.danger?'btn-danger':'btn-primary'}" data-act="sheetYes">${esc(s.yes||'تأكيد')}</button><button class="btn" data-act="closeSheet">تراجع</button></div>`;
  else if(s.type==='install') inner=installSheet();
  else if(s.type==='addm'&&L) inner=addMatchesSheet(L);
  else if(s.type==='backup') inner=backupSheet();
  else if(s.type==='import') inner=importSheet();
  else if(s.type==='names') inner=namesSheet();
  else if(s.type==='pin') inner=`<div class="sheet-head"><h3>${ic('lock')} رمز المسؤول</h3><button class="icon-btn" data-act="closeSheet" aria-label="إغلاق">${ic('x')}</button></div><p class="muted">هذا الإجراء يحتاج رمز المسؤول.</p><input type="password" inputmode="numeric" id="pin-in" maxlength="12" autocomplete="off">${s.err?`<div class="errs"><div><b>!</b> ${esc(s.err)}</div></div>`:''}<button class="btn btn-primary" data-act="pinOk">تأكيد</button>`;
  else if(s.type==='csv'){
    const text=csv(L);
    inner=`<div class="sheet-head"><h3>تصدير CSV</h3><button class="icon-btn" data-act="closeSheet" aria-label="إغلاق">${ic('x')}</button></div><p class="muted">انسخ النص والصقه في Excel أو Google Sheets.</p><textarea id="csv-out" readonly>${esc(text)}</textarea><div class="ctrl-row"><button class="btn btn-primary" data-act="copyCsv">${ic('copy')} نسخ</button>${IS_TOP?`<button class="btn" data-act="dlCsv">${ic('download')} تنزيل ملف</button><button class="btn" data-act="printPage">${ic('print')} طباعة</button>`:''}</div>`;
  }
  else if(s.type==='match'&&L){
    const m=byId(L,s.id); if(!m){ui.sheet=null;root.innerHTML='';return;}
    const i=L.matches.indexOf(m);
    inner=`<div class="sheet-head"><div><span class="eyebrow">${roundLabel(L,m)}</span><h3>${matchLabel(i)}</h3></div><button class="icon-btn" data-act="closeSheet" aria-label="إغلاق">${ic('x')}</button></div>`;
    if(m.status==='done'&&ui.edit&&ui.edit.id===m.id){
      const e=ui.edit,errs=E.validate(L,previewAttr(L,e));
      const changed=e.sa!==m.sa||e.sb!==m.sb||e.pk!==m.pk||JSON.stringify(e.events)!==JSON.stringify(m.events);
      const conflict=['a','b'].some(sd=>e.events.filter(x=>x.side===sd&&!x.auto).length>e['s'+sd]);
      inner+=`${board(L,e,'edit')}${koPk(L,e,'edit')}${conflict?'<div class="note warn">النتيجة الجديدة أقل من عدد الأهداف المسجلة للاعبين. عدّل إحصائيات اللاعبين أدناه.</div>':''}
       ${errs.length?`<div class="errs">${errs.map(x=>`<div><b>!</b> ${esc(x)}</div>`).join('')}</div>`:''}
       <button class="btn btn-primary" data-act="saveEdit" ${errs.length||!changed?'disabled':''}>${ic('check')} حفظ التصحيح وإعادة الحساب</button>
       ${goalLog(L,e,'edit')}
       <div class="ctrl-row"><button class="btn" data-act="replay" data-id="${m.id}">${ic('replay')} إعادة المباراة</button>${L.format!=='ko'?`<button class="btn btn-danger" data-act="cancelMatch" data-id="${m.id}">${ic('x')} إلغاء المباراة</button>`:''}</div>`;
    } else if(m.status==='pending'){
      inner+=`<div class="vs-line" style="color:var(--ink)"><b>${esc(pname(L,m.a))}</b><span>ضد</span><b>${esc(pname(L,m.b))}</b></div>
       <div class="ctrl-row"><button class="btn btn-primary" data-act="playNow" data-id="${m.id}" ${active(L)?'disabled':''}>${ic('play')} اجعلها المباراة التالية</button>${L.format!=='ko'?`<button class="btn btn-danger" data-act="cancelMatch" data-id="${m.id}">${ic('x')} إلغاء المباراة</button>`:''}</div>
       ${active(L)?'<p class="hint">توجد مباراة جارية الآن؛ يمكن نقل هذه بعد انتهائها، أو استخدم الأسهم في الجدول.</p>':''}`;
    } else if(m.status==='cancelled'){
      inner+=`<div class="vs-line" style="color:var(--ink)"><b>${esc(pname(L,m.a))}</b><span>ضد</span><b>${esc(pname(L,m.b))}</b></div><p class="muted">هذه المباراة ملغاة ولا تُحتسب في الترتيب.</p><button class="btn btn-primary" data-act="restoreMatch" data-id="${m.id}">${ic('replay')} استعادة المباراة</button>`;
    } else {
      inner+=`<div class="vs-line" style="color:var(--ink)"><b>${esc(pname(L,m.a))}</b><span class="sc">${sc2(m.sa,m.sb)}</span><b>${esc(pname(L,m.b))}</b></div><button class="btn btn-primary" data-act="go" data-v="match">${ic('timer')} الذهاب لشاشة المباراة</button>${L.format!=='ko'?`<button class="btn btn-danger" data-act="cancelMatch" data-id="${m.id}">${ic('x')} إلغاء المباراة</button>`:''}`;
    }
  }
  root.innerHTML=`<div class="sheet-ov" data-act="ovClose"><div class="sheet" role="dialog" aria-modal="true">${inner}</div></div>`;
  const pin=$('#pin-in'); if(pin) setTimeout(()=>{try{pin.focus();}catch(e){}},30);
}

    if(el.dataset.clock==='match'){const r=matchRemaining(L,m);el.textContent=fmt(r);el.classList.toggle('low',!!m&&m.status!=='scoring'&&r<=60000&&r>0);}

  document.querySelectorAll('[data-prog]').forEach(el=>{

  });

function tick(){

  if(L.format==='ko'&&m.status==='done'){const nx=L.matches.find(x=>x.ko&&x.ko.r===m.ko.r+1&&x.ko.k===(m.ko.k>>1));if(nx&&nx.status!=='pending')return toast('لا يمكن إعادتها: مباراة الدور التالي بدأت أو انتهت.');}
